.condition-delta{display:block;font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap}
.dashboard-change{font-size:15px;font-weight:700;margin-top:7px}.gdp{font-size:34px}
.delta{font-size:42px;line-height:1.2}
.feedback .changes{display:block;margin:24px 0 12px;font-size:14px}
.condition-result-heading,.condition-result{display:grid;grid-template-columns:1.1fr 1.2fr .7fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.condition-result-heading{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding-top:0}
.feedback .changes span{border:0;padding:0}
.result-label{font-size:13px;font-weight:600}.result-before-after{font-size:18px;white-space:nowrap}
.result-change{font-size:22px;text-align:right;white-space:nowrap}.condition-result-heading>span:last-child{text-align:right}
.preview-focus-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.preview-focus-tag{font-size:12px;font-weight:600;border:1px solid var(--line);padding:4px 8px;background:var(--paper);color:var(--ink)}
@media(max-width:720px){.condition-value{font-size:22px}.condition-delta{font-size:11px}.condition-label{font-size:9px}.gdp{font-size:28px}.delta{font-size:36px}.result-before-after{font-size:16px}.result-change{font-size:19px}.result-label{font-size:12px}.condition-result-heading,.condition-result{grid-template-columns:1.05fr 1.25fr .8fr;gap:8px}}

/* Culture indicator gauges — display only, no economic effect */
.culture-panel{background:var(--paper);border:1px solid var(--line);padding:14px 16px;margin-top:20px;font-size:12px}
.culture-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.culture-panel-head .eyebrow{margin:0}
.culture-toggle{border:0;padding:2px 6px;min-height:22px;font-size:11px;color:var(--muted);background:transparent;text-decoration:underline;text-underline-offset:3px}
.culture-gauges{display:grid;gap:8px}
.culture-gauge-row{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center}
.culture-gauge-label{font-size:11px;line-height:1.4;color:var(--muted)}
.culture-gauge-track{height:5px;background:#d5cfc1;border-radius:2px;overflow:hidden}
.culture-gauge-fill{height:5px;border-radius:2px;background:var(--accent);transform-origin:0 50%;transition:transform .5s ease-out}
.culture-gauge-num{font-size:11px;font-weight:700;text-align:right;color:var(--ink)}
.culture-note{font-size:10px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.culture-panel.collapsed .culture-gauges,.culture-panel.collapsed .culture-note{display:none}
/* Results screen cultural profile */
.culture-profile{margin:32px 0;padding:24px;background:var(--paper);border:1px solid var(--line)}
.culture-profile h3{font-size:20px;margin:0 0 16px}
.culture-profile-rows{display:grid;gap:16px}
.culture-profile-row{display:grid;grid-template-columns:110px 1fr 1fr;gap:16px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.culture-profile-row:first-child{border-top:0;padding-top:0}
.culture-profile-label{font-weight:700;font-size:12px}
.culture-profile-bar-wrap{display:flex;align-items:center;gap:8px}
.culture-profile-bar{height:6px;flex:1;background:#d5cfc1;border-radius:3px;overflow:hidden}
.culture-profile-fill{height:6px;border-radius:3px;background:var(--accent)}
.culture-profile-val{font-size:14px;font-weight:700;white-space:nowrap}
.culture-profile-interp{font-size:12px;line-height:1.6;color:var(--muted)}
.culture-profile-note{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
@media(max-width:720px){.culture-gauge-row{grid-template-columns:72px 1fr 24px}.culture-gauge-label{font-size:10px}.culture-profile-row{grid-template-columns:1fr 1fr;gap:10px}.culture-profile-label{grid-column:1/-1}.culture-profile-bar-wrap{grid-column:1}.culture-profile-interp{grid-column:2}}

/* Policy previews redraw only the landscape; the confirmed dashboard remains in place. */
.option.is-previewed{background:var(--paper);outline:2px solid var(--blue);outline-offset:2px}
.scene-wrap.is-policy-preview .scene{border-color:var(--blue)}
.scene-wrap.is-policy-preview .scene-title .eyebrow{color:var(--blue)}
.scene-preview-name{font-size:15px;line-height:1.4;display:block;margin-bottom:8px}
.scene-preview-copy{display:block;font-size:12px;line-height:1.7}
.scene-preview-copy + .scene-preview-copy{margin-top:8px}
.scene-preview-status{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.policy-sketch .proposal-asset{animation:proposal-in .3s ease-out both;transform-box:fill-box;transform-origin:center}
.policy-sketch .sketch-ring{fill:#f4f0e7;fill-opacity:.35;stroke:#315a78;stroke-width:1.5;stroke-dasharray:4 3}
.policy-sketch .sketch-label{font:600 10px Montserrat,sans-serif;fill:#252525;paint-order:stroke;stroke:#f4f0e7;stroke-width:3px}
@keyframes proposal-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{nav,button,.storage-bar{display:none!important}.scene-wrap{position:static}body{font-size:11pt}.play-layout{grid-template-columns:1fr 1fr}.preview-banner{background:transparent;color:var(--ink)}.option,.scene,.dashboard{break-inside:avoid}.timeline{grid-template-columns:repeat(3,1fr)}}

ing tool.", "cost": 13, "now": [0, 0, 0, 6, 0], "later": [3, 1, 2, 10, 0], "delay": 3, "feedback": "Independent checks invest in accountability as an institutional arrangement rather than relying on cultural hierarchy to correct itself. The benefit is long-run; the cost is immediate.", "tag": "audit", "requires": null, "culture_delta": {"trust": 10, "networks": 3, "long_horizon": 8}}], "unique": false, "culture_lens": "authority"}, {"year": 1984, "theme": "Cooperation & networks", "title": "Who gets through the door?", "context": "Trader associations and informal savings circles (susu) in Ghana supply credit, market information, and dispute resolution to their members — documented in microfinance literature as a real coordination resource. Your hypothetical credit programme can work through these existing associations, publish open application rules, or use cooperative guarantees. Each reaches different people and creates a different access question.", "sources": ["RES002-A07", "RES002-A11"], "options": [{"title": "Lend through known associations", "benefit": "Existing associations already have the relationships and local knowledge to identify reliable borrowers and coordinate repayment.", "risk": "People who are not already members of established associations — including recent migrants, women outside dominant networks, and younger workers — may find no path in.", "cost": 8, "now": [1, 0, 5, 1, 0], "later": [2, 1, 5, 2, 0], "delay": 1, "feedback": "Established associations mobilise cooperation quickly because membership implies mutual knowledge and accountability. The access question for non-members remains unresolved; this is not a cultural failing but a design tradeoff.", "tag": "networks", "requires": null, "culture_delta": {"trust": -3, "networks": 9, "long_horizon": 3}}, {"title": "Open applications with published criteria", "benefit": "Published loan criteria give people outside existing associations a clearer route to credit; selection becomes visible and co tenance", "requires": null, "culture_delta": {"trust": 4, "networks": 3, "long_horizon": 5}}, {"title": "Borrow for a rapid rebuild", "benefit": "Can restore productive assets sooner.", "risk": "Weak finances may reduce execution and resilience.", "cost": 22, "now": [0, 5, 5, 0, 0], "later": [3, 10, 11, 0, 0], "delay": 2, "feedback": "A rapid rebuild creates capacity but increases pressure on public finances.", "tag": "industry", "requires": {"key": "institutions", "min": 45}, "culture_delta": {"trust": 0, "networks": 2, "long_horizon": 3}}, {"title": "Restore the fiscal buffer first", "benefit": "Creates room for the next disruption.", "risk": "Schools and equipment receive less now.", "cost": 0, "now": [0, 0, 0, 3, 12], "later": [2, 2, 3, 3, 0], "delay": 2, "feedback": "Restoring reserves reduces vulnerability, but forgone investment still matters.", "tag": "reserve", "requires": null, "culture_delta": {"trust": 4, "networks": 0, "long_horizon": 6}}], "unique": true}, {"year": 1992, "theme": "Finance", "title": "How much can the budget carry?", "context": "The model gives every policy a public resource cost. These finances are game units, not Ghanaian debt or a historical budget series. Borrowing can build capability and can also constrain future choices.", "sources": ["SRC-WB-GHA20-001"], "options": [{"title": "Build a credible revenue system", "benefit": "Funds public work more steadily.", "risk": "New rules impose administrative costs.", "cost": 10, "now": [0, 0, 0, 4, 5], "later": [2, 1, 2, 6, 7], "delay": 2, "feedback": "Revenue capacity improves fiscal room and institutional delivery.", "tag": "audit", "requires": null, "culture_delta": {"trust": 7, "networks": 3, "long_horizon": 5}}, {"title": "Accelerate public investment", "benefit": "Builds productive assets despite limited savings.", "risk": "Low reserves can make investment less effective.", "cost": 23, "now": [1, 4, 5, 0, 0], "later": [5, 8, 12, 0, 0], "delay": 3, "feedback": "Borrowed investment needs preparation and later financing capacity.", "tag": "industry", "requires": {"key": "institutions", "min": 50}, "culture_delta": {"trust": 0, "networks": 2, "long_horizon": 4}}, {"title": "Consolidate and protect essentials", "benefit": "Restores fiscal room while preserving basic skills.", "risk": "New infrastructure waits.", "cost": 0, "now": [2, 0, 0, 1, 11], "later": [3, 2, 2, 2, 0], "delay": 2, "feedback": "Consolidation buys resilience, with slower expansion.", "tag": "reserve", "requires": null, "culture_delta": {"trust": 4, "networks": 0, "long_horizon": 5}}], "unique": false}, {"year": 1996, "theme": "Trade & learning", "title": "Selling abroad, learning at home", "context": "The Ghana diagnostic separates manufacturing depth from jobs moving into other activities. Choose a hypothetical trade strategy that helps firms learn; an export label alone cannot prove local capability.", "sources": ["SRC-WB-GHA20-001", "ECON001-A01"], "options": [{"title": "Support export suppliers", "benefit": "Links firms to larger buyers and standards.", "risk": "Benefits need logistics and established production.", "cost": 17, "now": [1, 2, 4, 0, 0], "later": [5, 3, 11, 1, 0], "delay": 3, "feedback": "Supplier learning works better when roads and power are already available.", "tag": "export", "requires": {"key": "infrastructure", "min": 45}, "culture_delta": {"trust": 3, "networks": 5, "long_horizon": 5}}, {"title": "Protect a young domestic industry", "benefit": "Creates space for local firms to invest.", "risk": "Shelter can reduce pressure to improve.", "cost": 14, "now": [1, 1, 5, 0, 0], "later": [5, 3, 8, 0, 0], "delay": 2, "feedback": "Temporary shelter builds capacity here, but with less institutional learning.", "tag": "industry", "requires": null, "culture_delta": {"trust": 0, "networks": 3, "long_horizon": 4}}, {"title": "Fund standards and open entry", "benefit": "Helps more firms meet common requirements.", "risk": "Firm growth is gradual and uneven.", "cost": 11, "now": [3, 0, 1, 4, 0], "later": [7, 2, 6, 5, 0], "delay": 2, "feedback": "Common standards spread skills and access rather than assuming trade automatically transfers knowledge.", "tag": "small", "requires": null, "culture_delta": {"trust": 6, "networks": 5, "long_horizon": 4}}], "unique": false}, {"year": 2000, "theme": "Enterprise access", "title": "A business beyond its first market", "context": "Ghana's trader associations and informal enterprise networks supply real services — market information, shared credit risk, introductions to buyers — but membership depends on established ties. The World Bank Ghana diagnostic documents that smaller firms face constraints on accessing equipment, finance, and market services beyond their first network. These fictional programme designs ask how to extend useful enterprise services without assuming all informal work faces the same problem.", "sources": ["SRC-WB-GHA20-001"], "options": [{"title": "Offer simple registration and services", "benefit": "Reduces the cost of joining formal service systems; a clear registration route gives any firm a documented identity that opens doors to public support.", "risk": "Registration reduces entry barriers but does not automatically provide buyers, equipment, or skills — a certificate alone does not raise productivity.", "cost": 10, "now": [1, 0, 2, 5, 0], "later": [4, 2, 5, 6, 0], "delay": 2, "feedback": "Simpler entry builds institutional access; the benefit depends on what comes after registration, not the registration itself. Non-member access improves, but existing association advantages remain.", "tag": "access", "requires": null, "culture_delta": {"trust": 8, "networks": 5, "long_horizon": 4}}, {"title": "Build shared workshops", "benefit": "Equipment that individual firms cannot afford becomes available through shared facilities; the benefit is proportional to how many firms can reach and use the workshops.", "risk": "Shared facilities need capable management and rules about access priority; without those, established firms may crowd out newcomers even in a shared space.", "cost": 18, "now": [2, 2, 3, 0, 0], "later": [6, 5, 10, 0, 0], "delay": 3, "feedback": "Shared assets increase productive capacity when institutions can manage access fairly. This extends the association-cooperation model to infrastructure without requiring prior membership.", "tag": "cooperate", "requires": {"key": "institutions", "min": 45}, "culture_delta": {"trust": 5, "networks": 9, "long_horizon": 6}}, {"title": "Use existing trader associations", "benefit": "Builds on the coordination and trust already inside associations; delivery is faster and cheaper when networks already do the administrative work.", "risk": "Associations serve their members; people outside the relevant association — including newcomers to the market and workers from different communities — may be missed by design.", "cost": 7, "now": [1, 0, 4, 1, 0], "later": [3, 2, 5, 2, 0], "delay": 1, "feedback": "Existing networks mobilise enterprise support quickly for current members. The access question for non-members is a design gap, not a failure of cultural cooperation — but it remains unresolved.", "tag": "networks", "requires": null, "culture_delta": {"trust": -3, "networks": 10, "long_horizon": 3}}], "unique": true, "culture_lens": "networks"}, {"year": 2005, "theme": "Long-term investment", "title": "Protect the plan, or change it?", "context": "Ghana's National Apprenticeship Programme and post-independence education investment represent documented attempts at sustained skills commitment — but programme continuity without feedback can protect a failing direction as easily as a successful one. This invented budget choice asks whether a multi-year skills commitment should be protected, reviewed, or completed. Long-term orientation is a question about investment and learning, not a national score.", "sources": ["RES002-A01", "ECON001-A03"], "options": [{"title": "Protect a multi-year learning budget", "benefit": "A sustained skills commitment gives apprentices, trainers, and firms time to build capability that a shorter cycle cannot deliver; learning compounds over years, not quarters.", "risk": "Results arrive slowly and are hard to observe in the next budget cycle; without a review mechanism, a patient commitment can become a protected failure.", "cost": 18, "now": [1, 0, 0, 2, 0], "later": [14, 3, 5, 2, 0], "delay": 4, "feedback": "Patient investment builds skills after a lag. The benefit is real — capability that needs time to accumulate — but it works best when some mechanism exists to verify the investment is producing results, not just continuing.", "tag": "patient", "requires": null, "culture_delta": {"trust": 4, "networks": 3, "long_horizon": 10}}, {"title": "Review and redirect weak projects", "benefit": "Evidence about which programmes are working changes where resources go; this turns continuity into adaptation rather than persistence for its own sake.", "risk": "Reorganisation interrupts delivery in the short run; established programmes resist redirection, and an evidence review can be captured by those whose programmes are under scrutiny.", "cost": 12, "now": [1, -1, 0, 5, 0], "later": [6, 3, 6, 7, 0], "delay": 2, "feedback": "Feedback combined with continuity is the productive combination. Redirection costs something in the short run; the long-run gain is that surviving the review signals the investment is actually working.", "tag": "voice", "requires": null, "culture_delta": {"trust": 9, "networks": 4, "long_horizon": 7}}, {"title": "Finish existing facilities first", "benefit": "Making past commitments usable before new ones begin reduces waste and realises learning that has already been paid for.", "risk": "A completion-first approach may postpone the new skills and new directions that would raise productivity beyond current trajectories.", "cost": 9, "now": [0, 6, 3, 1, 0], "later": [2, 5, 5, 1, 0], "delay": 1, "feedback": "Completion realises earlier work at modest cost. It conserves resources and avoids the visible waste of abandoned facilities, but it also commits less to the future pace of learning.", "tag": "maintenance", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 4}}], "unique": false, "culture_lens": "long_horizon"}, {"year": 2010, "theme": "Evaluation", "title": "Does activity mean productivity?", "context": "Moving from agriculture into services is not enough to establish productive transformation. The Ghana diagnostic makes productivity inside activities part of the question.", "sources": ["ECON001-A01", "SRC-WB-GHA20-001"], "options": [{"title": "Invest in skills where workers are", "benefit": "Improves existing services and production.", "risk": "Complex new industries may wait.", "cost": 13, "now": [3, 0, 2, 1, 0], "later": [9, 2, 6, 3, 0], "delay": 2, "feedback": "Within-sector learning matters alongside movement between sectors.", "tag": "small", "requires": null, "culture_delta": {"trust": 4, "networks": 5, "long_horizon": 5}}, {"title": "Launch an advanced production hub", "benefit": "Creates a focused opportunity for sophisticated work.", "risk": "Weak complementary skills can limit the return.", "cost": 23, "now": [0, 2, 5, 0, 0], "later": [6, 6, 14, 0, 0], "delay": 3, "feedback": "Advanced assets need skills and working connections.", "tag": "technical", "requires": {"key": "skills", "min": 60}, "culture_delta": {"trust": 2, "networks": -2, "long_horizon": 7}}, {"title": "Improve evidence and delivery", "benefit": "Helps public support follow observed bottlenecks.", "risk": "Raises capacity less immediately.", "cost": 11, "now": [2, 0, 0, 5, 0], "later": [5, 3, 5, 8, 0], "delay": 2, "feedback": "Better feedback makes later investment more effective rather than awarding instant income.", "tag": "audit", "requires": null, "culture_delta": {"trust": 8, "networks": 3, "long_horizon": 6}}], "unique": false}, {"year": 2015, "theme": "Services & production", "title": "Make a growing town more productive", "context": "Ghana's 2020 diagnostic describes service-heavy transformation and manufacturing underperformance. This invented earlier policy dilemma compares ways to improve productive work, without treating services as automatically unproductive.", "sources": ["SRC-WB-GHA20-001"], "options": [{"title": "Upgrade market and transport services", "benefit": "Improves everyday production and delivery.", "risk": "Does less to develop specialist industries.", "cost": 13, "now": [1, 4, 2, 1, 0], "later": [4, 6, 6, 2, 0], "delay": 2, "feedback": "Useful services connect producers and customers; sector labels alone do not determine quality.", "tag": "small", "requires": null, "culture_delta": {"trust": 4, "networks": 6, "long_horizon": 3}}, {"title": "Link universities and manufacturers", "benefit": "Supports technical problem-solving across organisations.", "risk": "Collaboration can take years to establish.", "cost": 20, "now": [2, 0, 2, 2, 0], "later": [12, 2, 10, 4, 0], "delay": 3, "feedback": "Technical cooperation builds learning where existing production can use it.", "tag": "technical", "requires": {"key": "capacity", "min": 55}, "culture_delta": {"trust": 5, "networks": 6, "long_horizon": 8}}, {"title": "Repair infrastructure and preserve reserves", "benefit": "Protects service reliability at lower fiscal cost.", "risk": "Makes a smaller commitment to new skills.", "cost": 6, "now": [0, 6, 1, 1, 3], "later": [2, 4, 3, 2, 0], "delay": 1, "feedback": "Repair and buffers protect current activity while limiting expansion.", "tag": "maintenance", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 4}}], "unique": true}, {"year": 2020, "theme": "Resilience", "title": "Keep people and production connected", "context": "WHO characterised COVID-19 as a pandemic on 11 March 2020. Your final decision covers six years to 2026. The shock date is historical; all policy effects and the recovery are simulated.", "sources": ["GAME-WHO20"], "options": [{"title": "Support skills and public delivery", "benefit": "Keeps learning and service capacity in view.", "risk": "Uses resources during disruption.", "cost": 17, "now": [3, 0, 1, 3, 0], "later": [8, 2, 5, 5, 0], "delay": 2, "feedback": "Skills and delivery support later resilience, without modelling the full health consequences.", "tag": "access", "requires": null, "culture_delta": {"trust": 5, "networks": 4, "long_horizon": 5}}, {"title": "Bridge firms through disruption", "benefit": "Preserves production and supply connections.", "risk": "Costly support may reach established firms first.", "cost": 20, "now": [0, 2, 6, 0, 0], "later": [3, 4, 9, 2, 0], "delay": 2, "feedback": "Firm support preserves capacity but puts more pressure on finances.", "tag": "industry", "requires": null, "culture_delta": {"trust": 0, "networks": 4, "long_horizon": 3}}, {"title": "Target support and rebuild reserves", "benefit": "Leaves financial room for prolonged uncertainty.", "risk": "Some recovery investments are smaller.", "cost": 5, "now": [1, 0, 1, 3, 7], "later": [4, 3, 3, 4, 0], "delay": 2, "feedback": "Targeted support balances delivery with a fiscal buffer.", "tag": "reserve", "requires": null, "culture_delta": {"trust": 5, "networks": 2, "long_horizon": 6}}], "unique": false}], "kor": [{"year": 1960, "theme": "Skills", "title": "Learning after reconstruction", "context": "Korea was liberated in 1945; the Republic was established in 1948. The approved evidence stresses war, aid, land reform and education as distinct starting conditions. This invented allocation starts with work already under way.", "sources": ["GAME-KOR-INDEP", "RES001-A07", "SRC-WB-EAM93-001"], "options": [{"title": "Broaden basic schooling", "benefit": "More learners can enter future opportunities.", "risk": "Buildings and teachers take time.", "cost": 15, "now": [2, 0, 0, 1, 0], "later": [11, 1, 3, 0, 0], "delay": 3, "feedback": "Broad learning widens participation before it deepens technical production.", "tag": "access", "requires": null, "culture_delta": {"trust": 4, "networks": 3, "long_horizon": 3}}, {"title": "Expand shop-floor apprenticeships", "benefit": "Connects learning to working firms.", "risk": "Established employers control much of the access.", "cost": 9, "now": [3, 0, 4, 0, 0], "later": [5, 1, 5, 0, 0], "delay": 2, "feedback": "Practical training improves current work sooner but can miss outsiders.", "tag": "networks", "requires": null, "culture_delta": {"trust": 0, "networks": 6, "long_horizon": 5}}, {"title": "Train technical specialists", "benefit": "Supports more demanding manufacturing.", "risk": "Specialisation needs equipment and opportunities.", "cost": 20, "now": [1, 0, 1, 0, 0], "later": [12, 1, 8, 0, 0], "delay": 4, "feedback": "Technical training produces more when infrastructure can support it.", "tag": "technical", "requires": {"key": "infrastructure", "min": 35}, "culture_delta": {"trust": 2, "networks": -3, "long_horizon": 7}}], "unique": false}, {"year": 1964, "theme": "Export capability", "title": "Can firms learn to sell abroad?", "context": "Korea's 1960 exports were mainly primary products. Later industrialisation involved capability building, export incentives and international conditions. This invented choice tests learning routes rather than claiming exports alone caused growth.", "sources": ["SRC-KIM1971-001", "SRC-WB-EAM93-001"], "options": [{"title": "Support exporters with clear milestones", "benefit": "Focuses assistance on observable delivery.", "risk": "Smaller firms may find entry difficult.", "cost": 17, "now": [1, 1, 4, 2, 0], "later": [5, 3, 11, 3, 0], "delay": 3, "feedback": "Export-linked support benefits from skills; performance rules are part of the design.", "tag": "export", "requires": {"key": "skills", "min": 40}, "culture_delta": {"trust": 6, "networks": 3, "long_horizon": 6}}, {"title": "Improve products for the home market", "benefit": "Lets firms learn with nearby customers.", "risk": "Less contact with foreign buyers and standards.", "cost": 11, "now": [2, 1, 4, 1, 0], "later": [5, 3, 7, 1, 0], "delay": 2, "feedback": "Domestic learning builds capability with less immediate fiscal strain.", "tag": "small", "requires": null, "culture_delta": {"trust": 3, "networks": 4, "long_horizon": 4}}, {"title": "Build common testing and training", "benefit": "Makes standards more accessible.", "risk": "Export volumes may grow slowly at first.", "cost": 13, "now": [3, 0, 1, 3, 0], "later": [9, 2, 6, 5, 0], "delay": 3, "feedback": "Shared services broaden the route into production and trade.", "tag": "access", "requires": null, "culture_delta": {"trust": 5, "networks": 6, "long_horizon": 4}}], "unique": true}, {"year": 1968, "theme": "Connections", "title": "A network for production and people", "context": "The East Asian evidence pack treats infrastructure as one complement to learning and investment. In this imagined allocation, transport routes can serve concentrated production or wider local access.", "sources": ["SRC-WB-EAM93-001"], "options": [{"title": "Connect industrial and port facilities", "benefit": "Coordinates production and shipment.", "risk": "High up-front cost and concentrated reach.", "cost": 20, "now": [0, 5, 3, 0, 0], "later": [1, 12, 8, 0, 0], "delay": 3, "feedback": "Concentrated logistics help production, while wider access remains a separate choice.", "tag": "export", "requires": null, "culture_delta": {"trust": 0, "networks": -3, "long_horizon": 4}}, {"title": "Connect provincial market towns", "benefit": "Spreads access to buyers and services.", "risk": "Many routes require ongoing upkeep.", "cost": 14, "now": [1, 3, 1, 2, 0], "later": [4, 9, 5, 1, 0], "delay": 2, "feedback": "Local links spread opportunities and strengthen the conditions for learning.", "tag": "access", "requires": null, "culture_delta": {"trust": 5, "networks": 6, "long_horizon": 3}}, {"title": "Maintain and decongest existing routes", "benefit": "Protects reliable delivery at lower cost.", "risk": "New connections develop more slowly.", "cost": 6, "now": [0, 7, 2, 1, 0], "later": [1, 4, 3, 0, 0], "delay": 1, "feedback": "Maintenance prevents useful networks from deteriorating.", "tag": "maintenance", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 4}}], "unique": false}, {"year": 1972, "theme": "Industry", "title": "How large should the next step be?", "context": "The evidence describes coordinated investment and also policy costs and mistakes. This hypothetical industrial budget asks whether larger projects fit the capabilities already available.", "sources": ["SRC-WB-EAM93-001"], "options": [{"title": "Coordinate a major industrial cluster", "benefit": "Creates capacity and shared assets together.", "risk": "Large projects strain finances and skills.", "cost": 23, "now": [0, 3, 4, 0, 0], "later": [4, 5, 15, 0, 0], "delay": 3, "feedback": "Scale requires complementary skills; coordination alone does not ensure a good project.", "tag": "industry", "requires": {"key": "skills", "min": 45}, "culture_delta": {"trust": 2, "networks": 3, "long_horizon": 6}}, {"title": "Grow supplier firms in stages", "benefit": "Helps existing production gain local depth.", "risk": "Smaller increments may miss economies of scale.", "cost": 12, "now": [2, 1, 4, 2, 0], "later": [5, 3, 8, 2, 0], "delay": 2, "feedback": "Supplier learning spreads capability through smaller commitments.", "tag": "small", "requires": null, "culture_delta": {"trust": 3, "networks": 5, "long_horizon": 4}}, {"title": "Modernise agriculture and food processing", "benefit": "Raises capability outside large factories.", "risk": "Leaves less money for advanced industry.", "cost": 11, "now": [1, 2, 4, 1, 0], "later": [4, 5, 7, 1, 0], "delay": 2, "feedback": "Agricultural capability remains part of development rather than a stage to erase.", "tag": "farm", "requires": null, "culture_delta": {"trust": 3, "networks": 4, "long_horizon": 3}}], "unique": false}, {"year": 1976, "theme": "Heavy industry", "title": "Ambition meets a budget", "context": "The World Bank's Korea sequence records heavy-industry investment and later capacity and financial pressures. These fictional alternatives ask how to handle that tension; they are not historical cabinet options.", "sources": ["SRC-WB-EAM93-001"], "options": [{"title": "Commit to large integrated plants", "benefit": "Can create substantial production capacity.", "risk": "Requires skills, infrastructure and fiscal room.", "cost": 24, "now": [0, 3, 6, 0, 0], "later": [4, 5, 16, 0, 0], "delay": 3, "feedback": "Integrated plants pay off more with infrastructure already in place.", "tag": "industry", "requires": {"key": "infrastructure", "min": 45}, "culture_delta": {"trust": 0, "networks": 2, "long_horizon": 6}}, {"title": "Expand machinery suppliers gradually", "benefit": "Builds technical depth through smaller firms.", "risk": "Capacity expands less rapidly.", "cost": 14, "now": [3, 1, 3, 2, 0], "later": [8, 3, 9, 2, 0], "delay": 2, "feedback": "Supplier capability can accumulate without a single very large commitment.", "tag": "technical", "requires": null, "culture_delta": {"trust": 3, "networks": 5, "long_horizon": 5}}, {"title": "Review debt and finish viable projects", "benefit": "Protects delivery and fiscal room.", "risk": "Some expansion is postponed.", "cost": 5, "now": [0, 4, 2, 3, 5], "later": [3, 4, 4, 4, 0], "delay": 2, "feedback": "A review sacrifices some scale while strengthening the ability to sustain projects.", "tag": "audit", "requires": null, "culture_delta": {"trust": 7, "networks": 3, "long_horizon": 6}}], "unique": true}, {"year": 1980, "theme": "Authority & feedback", "title": "Can the delivery office hear bad news?", "context": "Korea's Heavy and Chemical Industrialization programme (HCI, 1973–79) coordinated large investments through a concentrated authority structure. The World Bank's East Asian Miracle account documents that over-investment and capacity strain followed, requiring a 1979–80 stabilisation review. The correction happened at the programme level — but the question remains: what route existed for problems to surface before they reached crisis? Power distance is a lens for this question, not a trait assigned to Korean people.", "sources": ["RES002-A01", "RES002-A03", "SRC-WB-EAM93-001"], "options": [{"title": "Keep central coordination", "benefit": "A single authority structure can align large infrastructure investments, move resources quickly, and prevent fragmented decision-making across regions.", "risk": "When authority is concentrated, problems may only surface once they are large enough to reach the top — corrections arrive after costs have accumulated.", "cost": 9, "now": [0, 4, 3, 2, 0], "later": [1, 4, 4, 3, 0], "delay": 2, "feedback": "Coordination provides earlier productive assets. The tradeoff is that an authority structure without a named review channel may learn slowly when things go wrong.", "tag": "central", "requires": null, "culture_delta": {"trust": -5, "networks": 2, "long_horizon": 2}}, {"title": "Give workers and firms review channels", "benefit": "A named route for implementers — workers, local managers, supplier firms — to raise problems before they compound creates learning capacity alongside delivery capacity.", "risk": "Creating review channels takes time and negotiation; established hierarchies may resist and treat review as challenge rather than information.", "cost": 11, "now": [2, 0, 0, 5, 0], "later": [5, 2, 3, 7, 0], "delay": 2, "feedback": "Voice arrangements build institutional feedback capacity. The benefit is not cultural transformation but a specific mechanism: a named route for bad news to travel upward before it becomes a crisis.", "tag": "voice", "requires": null, "culture_delta": {"trust": 9, "networks": 5, "long_horizon": 6}}, {"title": "Audit project performance independently", "benefit": "An independent review body that does not report through the main authority chain can identify costly errors that internal channels miss.", "risk": "External oversight requires trained reviewers, delays some approvals, and can create friction with programme managers who control implementation.", "cost": 13, "now": [1, 0, 0, 6, 0], "later": [4, 1, 3, 9, 0], "delay": 3, "feedback": "Independent checks invest in the long-run effectiveness of delivery. Korea's stabilisation review after the HCI over-investment was a programme-level correction; building review capacity earlier makes smaller corrections possible before larger ones become necessary.", "tag": "audit", "requires": null, "culture_delta": {"trust": 10, "networks": 3, "long_horizon": 8}}], "unique": false, "culture_lens": "authority"}, {"year": 1984, "theme": "Cooperation & networks", "title": "Open a circle, or deepen it?", "context": "Korea's chaebol business groups — family-controlled conglomerates like Samsung, Hyundai, and LG — received preferential government credit tied to export-performance targets (Kim, 1971; World Bank EAM). Their supplier networks coordinated investment and transferred technical knowledge to connected firms. This hypothetical supplier programme asks whether to work through those established networks, publish open contract rules, or build joint supplier associations — each creates a different access boundary.", "sources": ["RES002-A07", "RES002-A11"], "options": [{"title": "Use established business groups", "benefit": "Chaebol-linked networks already have the relationships, technical knowledge, and shared standards to coordinate production quickly and at scale.", "risk": "Firms outside the chaebol network — independent manufacturers, regional suppliers — may find no entry route; the learning advantage concentrates where relationships already exist.", "cost": 9, "now": [1, 1, 5, 1, 0], "later": [2, 2, 6, 2, 0], "delay": 1, "feedback": "Established networks mobilise coordination quickly. Access concentrates in connected firms; new entrants face a higher barrier. This is a design tradeoff, not a cultural fate — the question is whether a separate entry route also exists.", "tag": "networks", "requires": null, "culture_delta": {"trust": -4, "networks": 9, "long_horizon": 3}}, {"title": "Publish open supplier contracts", "benefit": "Published terms give firms outside existing networks a visible route into production; selection criteria can be contested and appealed.", "risk": "Open contracting takes longer to administer and requires screening capacity; established firms with existing relationships may still have an informal advantage even when criteria are public.", "cost": 15, "now": [1, 0, 1, 5, 0], "later": [5, 2, 7, 6, 0], "delay": 3, "feedback": "Common rules extend access beyond personal ties. They do not eliminate the advantage of prior relationships, but they create a mechanism for new entrants that does not require knowing the right people first.", "tag": "access", "requires": null, "culture_delta": {"trust": 10, "networks": 4, "long_horizon": 5}}, {"title": "Fund joint supplier associations", "benefit": "Pooled training, shared problem-solving, and joint standards among a group of suppliers can spread technical knowledge beyond what individual firms could support alone.", "risk": "Association members may develop mutual dependence; technical knowledge stays within the association rather than spreading to the wider sector.", "cost": 12, "now": [3, 1, 3, 3, 0], "later": [6, 2, 6, 3, 0], "delay": 2, "feedback": "Cooperative structures spread learning and reduce individual investment costs. The risk is that cooperation within the association can become a new form of network exclusion rather than opening the sector.", "tag": "cooperate", "requires": null, "culture_delta": {"trust": 5, "networks": 8, "long_horizon": 5}}], "unique": false, "culture_lens": "networks"}, {"year": 1988, "theme": "Rural connections", "title": "Connections need useful services", "context": "KEPCO dates completion of the Rural Electrification Promotion Project to 1979. That programme history is not the WDI national access indicator. This invented 1988 choice asks what connected communities can do next.", "sources": ["SRC-KEPCO-HISTORY-001"], "options": [{"title": "Combine local training and enterprise services", "benefit": "Helps communities use existing connections.", "risk": "Results are dispersed across many places.", "cost": 14, "now": [3, 2, 2, 2, 0], "later": [7, 5, 6, 3, 0], "delay": 2, "feedback": "Connections become more useful when learning and productive opportunities accompany them.", "tag": "access", "requires": null, "culture_delta": {"trust": 5, "networks": 6, "long_horizon": 4}}, {"title": "Concentrate new industrial loads", "benefit": "Uses electricity for larger production.", "risk": "Benefits remain concentrated.", "cost": 20, "now": [0, 4, 5, 0, 0], "later": [3, 8, 11, 0, 0], "delay": 3, "feedback": "Industrial use adds capacity when skill and network conditions are ready.", "tag": "industry", "requires": {"key": "skills", "min": 50}, "culture_delta": {"trust": 0, "networks": -3, "long_horizon": 5}}, {"title": "Maintain local service reliability", "benefit": "Protects the network at lower cost.", "risk": "Does less to create new opportunities.", "cost": 6, "now": [0, 8, 1, 2, 0], "later": [2, 4, 3, 1, 0], "delay": 1, "feedback": "Reliable service preserves working assets rather than assuming a connection guarantees growth.", "tag": "maintenance", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 4}}], "unique": true}, {"year": 1992, "theme": "Finance", "title": "Finance expansion without losing room to act", "context": "The model's fiscal condition is an invented public resource scale. The later 1997 crisis is historical, but its model impact will depend on preparation rather than a predetermined national result.", "sources": ["GAME-KOR97"], "options": [{"title": "Strengthen oversight and fiscal capacity", "benefit": "Builds resilience and steadier delivery.", "risk": "Regulation and collection cost resources.", "cost": 11, "now": [0, 0, 0, 5, 5], "later": [3, 2, 2, 7, 7], "delay": 2, "feedback": "Oversight and reserves help absorb a financial disruption in the model.", "tag": "audit", "requires": null, "culture_delta": {"trust": 7, "networks": 3, "long_horizon": 6}}, {"title": "Accelerate coordinated investment", "benefit": "Builds capacity before competitors catch up.", "risk": "Low reserves make execution and shocks harder.", "cost": 24, "now": [1, 4, 6, 0, 0], "later": [5, 8, 13, 0, 0], "delay": 3, "feedback": "Accelerated investment increases capacity and fiscal exposure together.", "tag": "industry", "requires": {"key": "institutions", "min": 50}, "culture_delta": {"trust": 0, "networks": 3, "long_horizon": 5}}, {"title": "Consolidate and protect essential services", "benefit": "Leaves room for unexpected disruption.", "risk": "New facilities arrive more slowly.", "cost": 0, "now": [2, 0, 0, 1, 11], "later": [4, 2, 2, 2, 0], "delay": 2, "feedback": "A buffer protects the ability to act, with less immediate expansion.", "tag": "reserve", "requires": null, "culture_delta": {"trust": 4, "networks": 0, "long_horizon": 5}}], "unique": false}, {"year": 1996, "theme": "Trade & learning", "title": "Trade is a route, capability is the task", "context": "Korea's industrialisation had multiple interacting mechanisms. This hypothetical trade choice separates selling goods from deepening the knowledge and supplier relationships behind them.", "sources": ["ECON001-A03", "SRC-WB-EAM93-001"], "options": [{"title": "Link exporters to local suppliers", "benefit": "Can spread production knowledge.", "risk": "Needs reliable infrastructure and coordination.", "cost": 18, "now": [2, 2, 4, 1, 0], "later": [6, 3, 11, 2, 0], "delay": 3, "feedback": "Supplier links benefit from working logistics and take time to deepen.", "tag": "export", "requires": {"key": "infrastructure", "min": 50}, "culture_delta": {"trust": 4, "networks": 6, "long_horizon": 5}}, {"title": "Invest in domestic engineering", "benefit": "Strengthens technical capability.", "risk": "Costly learning can take years to reach customers.", "cost": 19, "now": [3, 0, 2, 1, 0], "later": [12, 2, 9, 2, 0], "delay": 4, "feedback": "Engineering capacity complements markets; it does not replace them.", "tag": "technical", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 8}}, {"title": "Open standards and training to smaller firms", "benefit": "Broadens routes into productive work.", "risk": "Scale develops more gradually.", "cost": 11, "now": [3, 0, 1, 4, 0], "later": [8, 2, 6, 5, 0], "delay": 2, "feedback": "Accessible standards spread skills beyond incumbent firms.", "tag": "small", "requires": null, "culture_delta": {"trust": 6, "networks": 6, "long_horizon": 4}}], "unique": false}, {"year": 2000, "theme": "After the financial crisis", "title": "Rebuild the balance sheet and the business", "context": "Korea entered a financial crisis in late 1997 and agreed an IMF arrangement in December. Your hypothetical post-crisis choices concern production, access and oversight; the model does not reproduce the actual reform programme.", "sources": ["GAME-KOR97"], "options": [{"title": "Repair balance sheets and supervision", "benefit": "Rebuilds fiscal and institutional room.", "risk": "New production investment is smaller.", "cost": 5, "now": [0, 0, 1, 5, 7], "later": [3, 2, 4, 6, 3], "delay": 2, "feedback": "Repair improves resilience and future delivery rather than guaranteeing immediate growth.", "tag": "audit", "requires": null, "culture_delta": {"trust": 7, "networks": 3, "long_horizon": 5}}, {"title": "Back smaller supplier firms", "benefit": "Broadens productive networks during recovery.", "risk": "Smaller firms also face execution risks.", "cost": 14, "now": [2, 1, 3, 3, 0], "later": [6, 3, 8, 4, 0], "delay": 2, "feedback": "Supplier support distributes learning and access beyond a few large organisations.", "tag": "small", "requires": null, "culture_delta": {"trust": 4, "networks": 7, "long_horizon": 4}}, {"title": "Refinance major production projects", "benefit": "Preserves and expands concentrated capacity.", "risk": "Large commitments can renew financial pressure.", "cost": 23, "now": [0, 3, 6, 0, 0], "later": [4, 5, 13, 0, 0], "delay": 3, "feedback": "Refinancing raises capacity but demands effective oversight and fiscal room.", "tag": "industry", "requires": {"key": "institutions", "min": 55}, "culture_delta": {"trust": 0, "networks": 2, "long_horizon": 4}}], "unique": true}, {"year": 2005, "theme": "Long-term investment", "title": "A steady course with a correction mechanism", "context": "Korea's vocational training system combined government co-funding with in-company training requirements; firms receiving support faced export-performance conditions that made continued support conditional rather than automatic. The Confucian examination tradition — where multi-year preparation for high-stakes testing was socially expected — is a plausible cultural hypothesis for why families sustained education investment, but the institutional design did the measurable work. This invented budget choice asks whether patient investment, mid-course review, or completion should come first.", "sources": ["RES002-A01", "ECON001-A03"], "options": [{"title": "Protect multi-year research and training", "benefit": "A sustained commitment to skills and research lets capability accumulate — each year of investment builds on the last rather than restarting from a shortened programme.", "risk": "Benefits arrive slowly; without a review mechanism, a patient commitment can protect underperforming programmes as effectively as strong ones.", "cost": 19, "now": [2, 0, 0, 2, 0], "later": [14, 2, 6, 3, 0], "delay": 4, "feedback": "Patient investment builds learning over years. Korea's vocational training was sustained and government-backed; the lesson is not cultural patience alone but institutional design that made multi-year commitment normal and review points visible.", "tag": "patient", "requires": null, "culture_delta": {"trust": 4, "networks": 3, "long_horizon": 10}}, {"title": "Review and redirect underperforming support", "benefit": "A review with published criteria can separate continuing investments that are producing results from those that are not; resources shift to where learning is actually happening.", "risk": "Review disrupts programmes in progress; established institutions resist redirection, and a badly designed review can protect powerful incumbents rather than productive learners.", "cost": 12, "now": [1, -1, 0, 5, 0], "later": [6, 3, 7, 7, 0], "delay": 2, "feedback": "Feedback makes continuity productive rather than merely persistent. Korea's export-performance discipline — support conditional on meeting targets — was a documented correction mechanism that allowed the government to sustain successful investments without protecting failing ones indefinitely.", "tag": "voice", "requires": null, "culture_delta": {"trust": 9, "networks": 4, "long_horizon": 7}}, {"title": "Complete and maintain existing facilities", "benefit": "Finishing facilities already under construction produces usable learning infrastructure at lower marginal cost than new commitments; existing programmes reach their intended beneficiaries.", "risk": "A completion-first approach invests less in new research and risks locking in existing directions rather than adapting to emerging productive opportunities.", "cost": 9, "now": [0, 7, 3, 1, 0], "later": [3, 5, 5, 1, 0], "delay": 1, "feedback": "Completion realises prior commitments at modest cost. It avoids visible waste while keeping institutional capacity intact — but it also makes less room for the new direction that later-stage development may need.", "tag": "maintenance", "requires": null, "culture_delta": {"trust": 3, "networks": 2, "long_horizon": 4}}], "unique": false, "culture_lens": "long_horizon"}, {"year": 2010, "theme": "Evaluation", "title": "Look inside productive capacity", "context": "Observed growth, manufacturing and skills do not isolate a single cause. This imagined evaluation budget asks how to improve capability while keeping institutional and economic explanations visible.", "sources": ["ECON001-A03", "RES002-A06"], "options": [{"title": "Upgrade skills across existing firms", "benefit": "Improves how productive assets are used.", "risk": "Cutting-edge projects may wait.", "cost": 14, "now": [4, 0, 2, 1, 0], "later": [10, 2, 7, 3, 0], "delay": 2, "feedback": "Learning inside firms matters alongside investment in new assets.", "tag": "small", "requires": null, "culture_delta": {"trust": 4, "networks": 5, "long_horizon": 5}}, {"title": "Build an advanced technology campus", "benefit": "Creates concentrated technical opportunities.", "risk": "Strong complementary skills are needed.", "cost": 24, "now": [1, 2, 5, 0, 0], "later": [7, 6, 15, 0, 0], "delay": 3, "feedback": "Advanced capacity gains more when a broad skill base is ready.", "tag": "technical", "requires": {"key": "skills", "min": 65}, "culture_delta": {"trust": 2, "networks": -2, "long_horizon": 8}}, {"title": "Improve evaluation and open procurement", "benefit": "Lets evidence shape future support.", "risk": "Capacity expands less immediately.", "cost": 11, "now": [2, 0, 0, 5, 0], "later": [6, 3, 5, 8, 0], "delay": 2, "feedback": "Evaluation improves later execution without attributing outcomes to a national character.", "tag": "audit", "requires": null, "culture_delta": {"trust": 8, "networks": 4, "long_horizon": 6}}], "unique": false}, {"year": 2015, "theme": "Innovation access", "title": "Who participates in the next wave?", "context": "Korea's government-sponsored research institutes (KIST, founded 1966; KAIST, 1971) built technical capacity with state backing. Chaebol firms concentrated much of Korea's private R&D investment; smaller supplier firms had more limited independent research capacity. This invented contemporary choice asks whether the next phase of innovation should open shared research to smaller firms, back major engineering programmes, or retrain workers across the existing industrial base — each creates a different innovation-access boundary.", "sources": ["SRC-WB-EAM93-001", "RES002-A11"], "options": [{"title": "Open research facilities to smaller firms", "benefit": "Publicly accessible research infrastructure lets firms outside the major chaebol networks participate in technological learning; shared facilities reduce the cost barrier for smaller enterprises.", "risk": "Shared research requires capable management and scheduling systems; without those, larger firms with dedicated staff may crowd out smaller users even in nominally open facilities.", "cost": 16, "now": [3, 1, 2, 3, 0], "later": [10, 3, 8, 5, 0], "delay": 3, "feedback": "Open facilities extend the innovation network beyond existing large-firm relationships. The institutional design of access rules determines whether this broadens participation or merely adds a formal route that established players navigate more easily.", "tag": "access", "requires": null, "culture_delta": {"trust": 8, "networks": 9, "long_horizon": 5}}, {"title": "Back major engineering programmes", "benefit": "Concentrated investment in advanced engineering deepens specialised production capacity; chaebol-linked programmes have the management depth and supplier networks to absorb large-scale technical investments.", "risk": "Large programmes concentrate financial exposure and R&D capability in a small number of firms; smaller and independent producers remain outside the main learning pathway.", "cost": 23, "now": [2, 2, 5, 0, 0], "later": [10, 5, 13, 1, 0], "delay": 3, "feedback": "Specialised programmes can deepen technical capacity quickly when productive capacity is already strong. The access question — who is inside this network — remains a design choice rather than a cultural given.", "tag": "technical", "requires": {"key": "capacity", "min": 60}, "culture_delta": {"trust": 0, "networks": -4, "long_horizon": 6}}, {"title": "Retrain workers and maintain systems", "benefit": "Spreading technical adaptation through the existing workforce reaches more people and preserves skills across the industrial base, not only at the frontier.", "risk": "Worker retraining produces more modest expansion of production assets; it may not create the advanced technical capability that frontier industries need.", "cost": 10, "now": [4, 3, 1, 2, 0], "later": [8, 4, 5, 3, 0], "delay": 2, "feedback": "Retraining distributes adaptation rather than concentrating it. The benefit is breadth — more workers participate in the next technological step — at the cost of depth at the frontier.", "tag": "patient", "requires": null, "culture_delta": {"trust": 5, "networks": 7, "long_horizon": 6}}], "unique": true, "culture_lens": "networks"}, {"year": 2020, "theme": "Resilience", "title": "Keep people and production connected", "context": "WHO characterised COVID-19 as a pandemic on 11 March 2020. The final policy runs through 2026. This model represents one production disruption and recovery conditions, not a health or welfare forecast.", "sources": ["GAME-WHO20"], "options": [{"title": "Support learning and public delivery", "benefit": "Maintains broad capacity during disruption.", "risk": "Costs resources while production is under pressure.", "cost": 18, "now": [4, 0, 1, 3, 0], "later": [9, 2, 5, 5, 0], "delay": 2, "feedback": "Learning and delivery build resilience through more than firm support alone.", "tag": "access", "requires": null, "culture_delta": {"trust": 5, "networks": 4, "long_horizon": 5}}, {"title": "Bridge firms and supply networks", "benefit": "Preserves concentrated productive capability.", "risk": "Costly support may favour established networks.", "cost": 21, "now": [0, 2, 7, 0, 0], "later": [4, 4, 9, 2, 0], "delay": 2, "feedback": "Supply support protects production but strains the public buffer.", "tag": "industry", "requires": null, "culture_delta": {"trust": 0, "networks": 4, "long_horizon": 3}}, {"title": "Target support and protect reserves", "benefit": "Leaves financial room if disruption persists.", "risk": "Expansion and learning investments are smaller.", "cost": 5, "now": [1, 0, 1, 3, 7], "later": [4, 3, 3, 4, 0], "delay": 2, "feedback": "Targeted support balances institutional capacity with reserves.", "tag": "reserve", "requires": null, "culture_delta": {"trust": 5, "networks": 2, "long_horizon": 6}}], "unique": false}]}, "sources": {"SRC-GHA-PLAN64-001": {"label": "(Government of Ghana, 1964)", "text": "Government of Ghana. (1964). Seven-year development plan 1963/64 to 1969/70. https://ndpc.gov.gh/media/Ghana_7_Year_Development_Plan_1963-4_1969-70_1964.pdf", "locator": "Foreign Trade and Payments chapter, PDF p. 224: roughly 60% of export income from cocoa and cocoa products; cocoa prices and production for 1959–1962", "date": "2026-10-04", "url": "https://ndpc.gov.gh/media/Ghana_7_Year_Development_Plan_1963-4_1969-70_1964.pdf", "status": "VERIFIED", "limitations": "Contradicts the country file's cocoa ~45% in 1960. Full report is large but original PDF and relevant passage were opened."}, "SRC-JEDWAB-MORADI12-001": {"label": "(Jedwab & Moradi, 2012)", "text": "Jedwab, R., & Moradi, A. (2012). Colonial investments and long-term development in Africa: Evidence from Ghanaian railways [Working paper]. Northeast Universities Development Consortium. https://www.dartmouth.edu/neudc2012/docs/paper_34.pdf", "locator": "Abstract; pp. 1-4; 6-10; Figures 1-3 on PDF pp. 25-27; Data Appendix A railway-data note on printed p. 36/PDF p. 37", "date": "2026-10-07", "url": "https://www.dartmouth.edu/neudc2012/docs/paper_34.pdf", "status": "VERIFIED", "limitations": "Facts and findings are citable; the paper gives no open artwork or geometry licence. Figures must not be reproduced or traced without permission."}, "ECON001-A01": {"label": "ECON001-A01", "text": "Structural transformation has at least two parts: productivity changes within sectors and labour moving between sectors; employment movement alone is not sufficient evidence of successful transformation.", "locator": "p. 11, opening framework and productivity decomposition", "date": "2026-10-08", "links": ["SRC-MCMILLAN-RODRIK-VERDUZCO14-001"]}, "SRC-WB-GHA20-001": {"label": "(World Bank, 2020)", "text": "World Bank. (2020). Structural transformation and labor market performance in Ghana. https://documents1.worldbank.org/curated/en/755321606255985947/pdf/Structural-Transformation-and-Labor-Market-Performance-in-Ghana.pdf", "locator": "pp. 1 and 5–7: Ghana transformation overview and sector shifts; pp. 32–33: decomposition/low-productivity services and manufacturing underperformance; Box 2 pp. 44–47, especially p. 46: Malaysia electronics industrialisation, Bayan Lepas, policy bundle, TNC share and imported-input/foreign-affiliate qualification; original PDF reopened", "date": "2026-10-08", "url": "https://documents1.worldbank.org/curated/en/755321606255985947/pdf/Structural-Transformation-and-Labor-Market-Performance-in-Ghana.pdf", "status": "VERIFIED", "limitations": "Ghana findings are diagnostic/descriptive rather than a causal estimate. Malaysia material is a comparative box in a Ghana report; gross electronics exports and foreign-owned assembly do not establish domestic value capture or generalized trust."}, "RES002-A01": {"label": "RES002-A01", "text": "Hofstede provides authoritative definitions for six country-level cultural dimensions, but his own account warns against confusing national and individual levels.", "locator": "pp. 6–8 and 9–16", "date": "2026-10-08", "links": ["SRC-HOFSTEDE11-001"]}, "RES002-A03": {"label": "RES002-A03", "text": "Ecological fallacy is a direct risk: country-level associations cannot be assigned to individuals or organisations.", "locator": "Brewer and Venaik publisher abstract and article span pp. 1063–1086 (pack locates principal discussion at pp. 1063–1069); Hofstede pp. 6 and 8", "date": "2026-10-08", "links": ["SRC-BREWER-VENAIK14-001", "SRC-HOFSTEDE11-001"]}, "RES002-A07": {"label": "RES002-A07", "text": "Generalized, limited or network, and institutional trust are different constructs; institutional trust itself differs by named target.", "locator": "pp. 41–44 and 66–79", "date": "2026-10-08", "links": ["SRC-OECD-TRUST17-001"]}, "RES002-A11": {"label": "RES002-A11", "text": "Radius of Trust is defensible only in a revised form that allows institutions and organisations to substitute for or extend interpersonal trust.", "locator": "OECD pp. 43–44 and 53–54; Nunn and Wantchekon Tables 3 and 6 pp. 3237/3241; Mauritius pp. 7–8; World Bank Box 2 pp. 44–47; PSA Tables A/1/2", "date": "2026-10-08", "links": ["SRC-OECD-TRUST17-001", "SRC-NUNN-WANTCHEKON11-001", "SRC-IMF-MUS14-001", "SRC-WB-GHA20-001", "SRC-PSA-ASPBI23-001"]}, "ECON001-A03": {"label": "ECON001-A03", "text": "Korea's industrialisation was sequenced and multi-causal: capability building, education, land and agricultural change, infrastructure, investment coordination, export-linked discipline, technology acquisition, international conditions, policy mistakes, and later corrections interacted.", "locator": "pp. 20–26/79–80/127–130/159–161", "date": "2026-10-08", "links": ["SRC-WB-EAM93-001"]}, "RES001-A07": {"label": "RES001-A07", "text": "Korea's colonial inheritance is contested: some scholarship stresses state and industrial lineage, while competing work stresses unequal ownership, division, war, and post-1961 change.", "locator": "Kohli pp. 1269-1271, 1277-1284, 1288-1291; Haggard et al. pp. 867-881", "date": "2026-10-07", "links": ["SRC-KOHLI94-001", "SRC-HAGGARD97-001"]}, "SRC-WB-EAM93-001": {"label": "(World Bank, 1993)", "text": "World Bank. (1993). The East Asian miracle: Economic growth and public policy. Oxford University Press. https://documents.worldbank.org/en/publication/documents-reports/documentdetail/975081468244550798/the-east-asian-miracle-economic-growth-and-public-policy", "locator": "pp. 4–7: fundamentals and variation/no single model; pp. 20–26: selective intervention, export performance discipline, technology access, mixed results and counterfactual limits; pp. 79–80: international conditions; pp. 127–130: Korea policy sequence, credit/export incentives and heavy-industry pressures; pp. 159–161: land/agricultural change, education/infrastructure and later adjustment; p. 242: sector-targeting costs/failures; official 402-page PDF reopened", "date": "2026-10-08", "url": "https://documents.worldbank.org/en/publication/documents-reports/documentdetail/975081468244550798/the-east-asian-miracle-economic-growth-and-public-policy", "status": "VERIFIED", "limitations": "Comparative institutional synthesis, not a clean causal decomposition. It explicitly lacks rigorous counterfactuals, records policy failures/costs and heterogeneous policy mixes, and cannot be treated as proof of a single export-led East Asian formula."}, "SRC-KIM1971-001": {"label": "(Kim, 1971)", "text": "Kim, H. C. (1971). Korea's export success, 1960–69. Finance & Development, 8(1), 14–21. https://doi.org/10.5089/9781616353025.022.A003", "locator": "Table 1, pp. 16–17: 1960 commodity exports US$32.8m; primary products US$28.3m (86.3%); manufactured goods US$4.5m (13.7%); table source Bank of Korea Monthly Economic Statistics", "date": "2026-10-04", "url": "https://doi.org/10.5089/9781616353025.022.A003", "status": "VERIFIED", "limitations": "Supports a stronger and more precise 1960 split than the country file's >70%/<30% statement."}, "RES002-A06": {"label": "RES002-A06", "text": "Wealth and cultural indices may be jointly determined; Hofstede specifically warns about wealth correlations and reverse causality for individualism.", "locator": "pp. 8 and 16", "date": "2026-10-08", "links": ["SRC-HOFSTEDE11-001"]}, "SRC-MCMILLAN-RODRIK-VERDUZCO14-001": {"label": "(McMillan et al., 2014)", "text": "McMillan, M., Rodrik, D., & Verduzco-Gallo, Í. (2014). Globalization, structural change, and productivity growth, with an update on Africa. World Development, 63, 11–32. https://doi.org/10.1016/j.worlddev.2013.10.012", "locator": "p. 11, opening framework and productivity decomposition: economy-wide productivity changes through within-sector productivity change and labour reallocation between sectors; publisher article record and author-hosted full text opened", "date": "2026-10-08", "url": "https://doi.org/10.1016/j.worlddev.2013.10.012", "status": "VERIFIED", "limitations": "The decomposition distinguishes channels; it does not make employment movement alone evidence of successful transformation or require a linear agriculture-to-manufacturing path."}, "SRC-HOFSTEDE11-001": {"label": "(Hofstede, 2011)", "text": "Hofstede, G. (2011). Dimensionalizing cultures: The Hofstede model in context. Online Readings in Psychology and Culture, 2(1), Article 8. https://doi.org/10.9707/2307-0919.1014", "locator": "pp. 6–8: IBM survey construction, aggregation level and individual variation; pp. 8 and 16: wealth controls and reverse-causality warning; pp. 9–16: definitions of PDI/UAI/IDV/MAS/LTO/IVR, including UAI not equal to risk avoidance; original 12-page article PDF and publisher record opened", "date": "2026-10-08", "url": "https://doi.org/10.9707/2307-0919.1014", "status": "VERIFIED", "limitations": "Country-level relative indices assembled from different survey populations/vintages; not individual traits, timeless national personalities, trust measures, or causal estimates. Article carries a CC BY-NC-ND licence."}, "SRC-BREWER-VENAIK14-001": {"label": "(Brewer & Venaik, 2014)", "text": "Brewer, P., & Venaik, S. (2014). The ecological fallacy in national culture research. Organization Studies, 35(7), 1063–1086. https://doi.org/10.1177/0170840613517602", "locator": "Publisher bibliographic record and abstract; article pp. 1063–1086; abstract states that national-level culture-scale correlations do not carry over in the same way to individual or organisational levels; pack cites principal discussion at pp. 1063–1069, not independently full-text checked", "date": "2026-10-08", "url": "https://doi.org/10.1177/0170840613517602", "status": "PARTIAL", "limitations": "Publisher full text was inaccessible. The abstract directly supports the narrow ecological-fallacy claim, but exact internal page wording remains unverified; pair with Hofstede (2011), pp. 6 and 8."}, "SRC-OECD-TRUST17-001": {"label": "(Organisation for Economic Co-operation and Development, 2017)", "text": "Organisation for Economic Co-operation and Development. (2017). OECD guidelines on measuring trust. OECD Publishing. https://doi.org/10.1787/9789264278219-en", "locator": "pp. 41–44: generalized/limited interpersonal trust and institutional trust constructs; pp. 53–54: survey families/measurement coverage; pp. 62–79: nonresponse, validity, interpretation and target/wording limitations; original 215-page PDF opened", "date": "2026-10-08", "url": "https://doi.org/10.1787/9789264278219-en", "status": "VERIFIED", "limitations": "Trust estimates depend on target, question wording, scale, survey context, population and mode. Institutional trust must name the institution; these measures do not establish historical causation or justify combining incompatible country snapshots."}, "SRC-NUNN-WANTCHEKON11-001": {"label": "(Nunn & Wantchekon, 2011)", "text": "Nunn, N., & Wantchekon, L. (2011). The slave trade and the origins of mistrust in Africa. American Economic Review, 101(7), 3221–3252. https://doi.org/10.1257/aer.101.7.3221", "locator": "Table 3 p. 3237: OLS estimates for trust in relatives, neighbours, local council and intra-/intergroup respondents; Table 6 p. 3241: IV estimates; final AER PDF and publisher record opened", "date": "2026-10-08", "url": "https://doi.org/10.1257/aer.101.7.3221", "status": "VERIFIED", "limitations": "African 2005 Afrobarometer research design and historically patterned associations/IV estimates; trust targets remain differentiated. It is not a six-country contemporary comparison and does not justify back-casting a national trust score."}, "SRC-IMF-MUS14-001": {"label": "(Svirydzenka & Petri, 2014)", "text": "Svirydzenka, K., & Petri, M. (2014). Mauritius: The drivers of growth-Can the past be extended? (IMF Working Paper No. 14/134). International Monetary Fund. https://www.imf.org/external/pubs/ft/wp/2014/wp14134.pdf", "locator": "pp. 5-8; p. 12; p. 17 note 13; sugar rents/preferences, EPZ, institutions/networks, self-employment and policy continuity; original PDF opened", "date": "2026-10-06", "url": "https://www.imf.org/external/pubs/ft/wp/2014/wp14134.pdf", "status": "VERIFIED", "limitations": "Analytical working paper; mechanisms are not isolated causal estimates."}, "SRC-PSA-ASPBI23-001": {"label": "(Philippine Statistics Authority, 2023)", "text": "Philippine Statistics Authority. (2023, November 28). 2020 Annual Survey of Philippine Business and Industry (ASPBI)-All establishments by employment grouping: Final results (Reference No. 2023-SSO-215). https://psa.gov.ph/content/2020-annual-survey-philippine-business-and-industry-aspbi-all-establishments-employment", "locator": "Tables A; 1; 2: micro/large establishment and employment shares", "date": "2026-10-06", "url": "https://psa.gov.ph/content/2020-annual-survey-philippine-business-and-industry-aspbi-all-establishments-employment", "status": "PARTIAL", "limitations": "PSA page blocked automated reopening in SRC-002; DATA-005 records prior opening. Formal establishments only and pandemic-affected."}, "SRC-KOHLI94-001": {"label": "(Kohli, 1994)", "text": "Kohli, A. (1994). Where do high growth political economies come from? The Japanese lineage of Korea's developmental state. World Development, 22(9), 1269-1293. https://doi.org/10.1016/0305-750X(94)00051-4", "locator": "pp. 1269-1271; 1277-1284; 1288-1291", "date": "2026-10-07", "url": "https://doi.org/10.1016/0305-750X(94)00051-4", "status": "VERIFIED", "limitations": "Interpretive lineage argument; must be paired with coercion, ownership, division, war, and post-1961 counterevidence."}, "SRC-HAGGARD97-001": {"label": "(Haggard et al., 1997)", "text": "Haggard, S., Kang, D., & Moon, C.-I. (1997). Japanese colonialism and Korean development: A critique. World Development, 25(6), 867-881. https://doi.org/10.1016/S0305-750X(97)00012-0", "locator": "pp. 867-881; especially 867-870; 872-877; 875-881", "date": "2026-10-07", "url": "https://doi.org/10.1016/S0305-750X(97)00012-0", "status": "VERIFIED", "limitations": "Competing interpretation stressing modest colonial growth, unequal ownership, northern industrial concentration, division, war, and post-1961 change."}, "SRC-WDI-001": {"label": "World Bank (2026)", "text": "World Bank. (2026). World Development Indicators [Data set]. Retrieved October 6, 2026, from https://databank.worldbank.org/source/world-development-indicators", "locator": "NY.GDP.PCAP.KD, GHA and KOR, frozen observations at 1960, 1990 and 2020; constant 2015 US dollars. Project CSV retrieved 4 October 2026; common metadata release 13 July 2026. All six values and claim IDs are embedded in historical data. Comparison always matches the simulated annual value to the same observed year; no interpolation or 2026 historical observation.", "date": "2026-10-04", "url": "https://databank.worldbank.org/source/world-development-indicators", "status": "VERIFIED", "limitations": "Dynamic dataset; values can be revised. The DATA-006 freeze uses one release across all six economies and preserves row-level API locators."}, "GHA-INDEP": {"label": "U.S. Department of State (n.d.)", "text": "U.S. Department of State, Office of the Historian. (n.d.). A guide to the United States’ history of recognition, diplomatic, and consular relations, by country, since 1776: Ghana.", "locator": "Recognition: U.S. recognition of Ghanaian independence, 1957; 6 March 1957.", "date": "2026-10-15", "url": "https://history.state.gov/countries/ghana"}, "GAME-KOR-INDEP": {"label": "Seoul Shinmun (1948)", "text": "Seoul Shinmun. (1948, August 15). 사설: 대한민국 정부수립 선포 [Editorial: Proclamation of the establishment of the Republic of Korea government]. In Materials on the history of the Republic of Korea (Vol. 7). National Institute of Korean History, Korean History Database.", "locator": "Record dh_007_1948_08_15_0020, opening paragraph: government proclaimed on 15 August, three years after liberation; explicitly recalls 15 August 1945. Original Korean archival text opened. Only dates are used, not the editorial’s political interpretation. Government establishment also corroborated by Korea.net official Constitution page indexed extract; that page has a direct-access redirect loop.", "date": "2026-10-15", "url": "https://db.history.go.kr/contemp/level.do?levelId=dh_007_1948_08_15_0020"}, "GAME-OIL73": {"label": "Corbett (2013)", "text": "Corbett, M. (2013, November 22). Oil shock of 1973–74. Federal Reserve History.", "locator": "Heading October 1973–January 1974 and opening account of the October 1973 embargo. Only the date and external price shock are historical here; country effect sizes are model assumptions.", "date": "2026-10-15", "url": "https://www.federalreservehistory.org/essays/oil-shock-of-1973-74"}, "GAME-GHA83": {"label": "Boughton (2001)", "text": "Boughton, J. M. (2001). The IMF and the poor: Soft loans, hard adjustment. In Silent revolution: The International Monetary Fund 1979–1989 (Chap. 14). International Monetary Fund.", "locator": "Ghana section, printed p. 673, footnote 97: prolonged drought, depressed cocoa market and repatriation; the 1983 crisis and adjustment are described in adjacent paragraphs. Original IMF-hosted chapter downloaded and text inspected. April 1983 recovery-programme date also corroborated by IMF, Recent economic performance, https://www.elibrary.imf.org/display/book/9781557751829/ch002.xml, opening paragraph (indexed extract; direct eLibrary access limited).", "date": "2026-10-15", "url": "https://www.imf.org/external/pubs/ft/history/2001/ch14.pdf"}, "GAME-KOR97": {"label": "International Monetary Fund (1998)", "text": "International Monetary Fund. (1998, June 19). IMF concludes Article IV consultation with Korea (Press Information Notice No. 98/39).", "locator": "Background, first two paragraphs: financial crisis in late 1997; IMF arrangement 4 December 1997. Magnitude of game disruption is an assumption.", "date": "2026-10-15", "url": "https://www.imf.org/en/news/articles/2015/09/28/04/53/pn9839"}, "GAME-WHO20": {"label": "World Health Organization (n.d.)", "text": "World Health Organization. (n.d.). Coronavirus disease (COVID-19) pandemic. Retrieved October 15, 2026, from https://www.who.int/europe/emergencies/situations/covid-19", "locator": "Overview: outbreak characterised as pandemic 11 March 2020. Model does not estimate mortality or welfare effects.", "date": "2026-10-15", "url": "https://www.who.int/europe/emergencies/situations/covid-19"}, "SRC-KEPCO-HISTORY-001": {"label": "Korea Electric Power Corporation (n.d.)", "text": "Korea Electric Power Corporation. (n.d.). History. Retrieved October 15, 2026, from https://www.kepco.co.kr/eng/about-us/company/history.do", "locator": "KEPCO timeline, 1979: completion of Rural Electrification Promotion Project. Programme completion is not national population access; no percentage is inferred.", "date": "2026-10-15", "url": "https://www.kepco.co.kr/eng/about-us/company/history.do"}, "MAP": {"label": "Natural Earth (n.d.)", "text": "Natural Earth. (n.d.). Admin 0 – Countries (1:110m) [Geographic data set].", "locator": "Existing project GeoJSON, 177 features; equirectangular conversion, simplified display coordinates; Antarctica omitted. Modern locator geography, not a 1960 political map. Public domain; terms verified. All terrain, buildings and scene art are original symbolic illustrations.", "date": "2026-10-15", "url": "https://www.naturalearthdata.com/about/terms-of-use/"}, "ART-GHA-001": {"label": "UNESCO World Heritage Centre (n.d.)", "text": "UNESCO World Heritage Centre. (n.d.). Asante traditional buildings. Retrieved October 15, 2026, from https://whc.unesco.org/en/list/35", "locator": "Outstanding Universal Value, brief synthesis: courtyard arrangements and timber/bamboo/mud-plaster construction near Kumasi. Authenticity: many roofs replaced with corrugated iron. These particular heritage buildings inform selected courtyard motifs, not all Ghanaian housing. No shrine, sacred motif or bas-relief is reproduced; illustrations are original composites.", "date": "2026-10-15", "url": "https://whc.unesco.org/en/list/35"}, "ART-KOR-001": {"label": "Seoul Metropolitan Government (n.d.)", "text": "Seoul Metropolitan Government. (n.d.). Seoul hanok: Understanding hanok. Seoul Hanok Portal.", "locator": "Hanok architectural form and regional layout differences, raised wooden main hall and wood-floored spaces. Used to inform original courtyard/tiled-roof/wood-frame motifs. Does not establish a uniform national housing style or measured game stock.", "date": "2026-10-15", "url": "https://hanok.seoul.go.kr/front/eng/info/infoHanok.do?tab=2"}, "ART-KOR-002": {"label": "Seoul Museum of History (2014)", "text": "Seoul Museum of History. (2014). The republic of apartments [Exhibition description].", "locator": "Exhibition content: apartment living as part of contemporary Korean urban life, including relocation and redevelopment experiences. In-game blocks are original symbolic forms, not a reconstruction of a particular building. The shared year/capability thresholds for modern buildings are design rules.", "date": "2026-10-15", "url": "https://museum.seoul.go.kr/eng/board/NR_boardView.do?bbsCd=1042&seq=20140303104228549"}, "GAME-WDI-ANNUAL-20261008": {"label": "World Bank (2026), decision-year data", "text": "World Bank. (2026). World Developm function cultureFromHistory(history,scenarios,country){
 const base=CULTURE_START[country]||{trust:50,networks:50,long_horizon:50};

function validateSave(raw){

 if(raw.phase!==s.phase||raw.year!==s.year||raw.index!==s.index||!Number.isFinite(raw.gdp)||Math.abs(raw.gdp-s.gdp)>1e-7||JSON.stringify(raw.pending)!==JSON.stringify(s.pending)||JSON.stringify(raw.values)!==JSON.stringify(s.values)||JSON.stringify(raw.annual)!==JSON.stringify(s.annual))throw Error('Save data does not match its deterministic choice history.');
