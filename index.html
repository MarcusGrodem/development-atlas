 modelLabel=clamp(modelLabel,34,235);actualLabel=clamp(actualLabel,34,235);
 const marker=(p)=>s.country==='gha'?`<circle data-observed-year="${p.year}" cx="${x(p.year)}" cy="${y(p.value)}" r="4" fill="#f4f0e7" stroke="#514e48" stroke-width="2"/>`:`<path data-observed-year="${p.year}" d="M${x(p.year)} ${y(p.value)-5}l5 5l-5 5l-5 -5Z" fill="#f4f0e7" stroke="#514e48" stroke-width="2"/>`;
 return `<div class="chart historical-chart"><svg viewBox="0 0 720 284" role="img" aria-label="${COUNTRIES[s.country].name}: your simulated annual GDP per person through ${s.year}, with actual GDP observations only at ${actual.map(p=>p.year).join(', ')}. Constant 2015 US dollars. Matched scale starts at zero. No observed 2026 value."><text x="54" y="22">GDP per person · constant 2015 US$ · ${COUNTRIES[s.country].name}</text><path d="M54 45V226H530" fill="none" stroke="#a6a08f"/><text x="8" y="230">$0</text><text x="8" y="46">${money(max)}</text><path d="${path}" fill="none" stroke="${COUNTRIES[s.country].color}" stroke-width="3"/><path d="${observedPath}" data-historical-path="true" fill="none" stroke="#514e48" stroke-width="2" stroke-dasharray="6 5"/>${actual.map(marker).join('')}<path d="M${x(s.year)} ${y(s.gdp)}L540 ${modelLabel}" fill="none" stroke="${COUNTRIES[s.country].color}"/><text x="546" y="${modelLabel}" class="chart-series-label">Your run ${s.year}</text><text x="546" y="${modelLabel+14}">${money(s.gdp)}</text><path d="M${x(last.year)} ${y(last.value)}L540 ${actualLabel}" fill="none" stroke="#514e48"/><text x="546" y="${actualLabel}" class="chart-series-label">Actual ${last.year}</text><text x="546" y="${actualLabel+14}">${money(last.value)}</text>${[1960,1990,2020,2026].map(year=>`<text x="${x(year)}" y="251" text-anchor="middle">${year}</text>`).join('')}</svg><p class="small muted">Actual dots use verified World Bank values for the decision years, plus the original 1990 anchor. Dashed connectors guide the eye; intervening historical values are not inferred. World Bank (2026).</p></div>`;
}
function insights(s){const count=tags=>s.history.filter(h=>tags.includes(h.tag)).length,c=conditions(s),learn=count(['technical','patient','small']),open=count(['voice','audit','access']),buffer=count(['reserve','maintenance']);return [
 {title:'Capability is cumulative',text:`You chose ${learn} technical, patient-learning or smaller-firm routes. Skills ended at ${Math.round(c.skills)}/100 and productive capacity at ${Math.round(c.capacity)}/100. In this model, capacity works with skills and infrastructure; income is not awarded directly for picking an industry.`},
 {title:'Cooperation needs a route in',text:`You chose ${open} open-access, voice or oversight routes. Institutions ended at ${Math.round(c.institutions)}/100. These choices explore network access and power-distance questions through rules and feedback, rather than assigning a fixed cultural trait to ${COUNTRIES[s.country].name}.`},
 {title:'Continuity needs room to adapt',text:`You chose ${buffer} reserve or maintenance routes and ${s.history.filter(h=>h.tag==='industry').length} large-investment routes. Finances ended at ${Math.round(c.finances)}/100. Your run encountered ${s.events.length} dated disruptions. Model delivery and shock impacts depended on preparation; patient investment and correction can work together.`}];}
const ROUTE_LABELS={access:'Broader access',networks:'Established networks',technical:'Technical learning',industry:'Industrial investment',small:'Local enterprise',farm:'Farm-linked production',reserve:'Financial resilience',maintenance:'Maintain existing assets',export:'Export connections',cooperate:'Shared learning',voice:'Local voice & feedback',central:'Central coordination',audit:'Oversight & delivery',patient:'Patient investment'};
const SHORT_CONDITIONS=['Skills','Infrastructure','Production','Institutions','Finances'];
function decisionDirection(h){
 const changes=h.after.values.map((value,i)=>({key:KEYS[i],label:SHORT_CONDITIONS[i],delta:value-h.before.values[i]}));
 const gains=changes.filter(c=>direction(c.delta)==='gain').sort((a,b)=>b.delta-a.delta).slice(0,2);
 const losses=changes.filter(c=>direction(c.delta)==='loss').sort((a,b)=>a.delta-b.delta).slice(0,1);
 const headlines={skills:'Stronger skills',infrastructure:'Better connections',capacity:'More productive capacity',institutions:'Stronger institutions',finances:'More financial room'};
 const headline=gains.length?headlines[gains[0].key]:losses.length?'Pressure on '+losses[0].label.toLowerCase():'Conditions largely stable';
 return {headline,changes,visible:[...gains,...losses]};
}
function decisionHistory(s){
 return `<section class="decision-history" aria-labelledby="decision-history-title"><div class="decision-history-intro"><span class="eyebrow">Your ${s.history.length} decisions</span><h2 id="decision-history-title">The path you chose</h2><p>Follow each policy from choice to outcome. Changes include earlier investments, upkeep and dated events as well as the choice made in that period.</p></div><div class="decision-ledger-head" aria-hidden="true"><span>Period</span><span>Your choice & route</span><span>Direction during this period</span><span>GDP per person</span></div><ol class="decision-ledger">${s.history.map(h=>{
 const policy=DATA.scenarios[s.country][h.index].options[h.choice],movement=decisionDirection(h),rate=(h.after.gdp/h.before.gdp-1)*100;
 return `<li class="decision-row" data-decision-index="${h.index}"><div class="decision-period"><span class="decision-number">${String(h.index+1).padStart(2,'0')} / ${s.history.length}</span><strong>${h.year}<span aria-hidden="true"> → </span>${h.to}</strong><span>${h.to-h.year} years</span></div><div class="decision-choice"><span class="decision-theme">${esc(h.theme)} · Option ${'ABC'[h.choice]}</span><h3>${esc(h.policy)}</h3><span class="decision-route">${esc(ROUTE_LABELS[h.tag]||h.theme)}</span></div><div class="decision-direction"><strong>${movement.headline}</strong><ul class="direction-changes" aria-label="Largest model condition changes">${movement.visible.map(change=>`<li class="${direction(change.delta)}" data-condition="${change.key}"><span>${change.label}</span><strong>${signedChange(change.delta)}</strong></li>`).join('')||'<li class="steady">→ No material condition change</li>'}</ul>${h.shocks.length?`<div class="decision-events">${h.shocks.map(event=>`<span>${esc(event.title)}</span>`).join('')}</div>`:''}</div><div class="decision-outcome"><span class="decision-outcome-year">GDP in ${h.to}</span><strong class="decision-gdp">${money(h.after.gdp)}</strong><span class="${direction(rate)}">${rate>=0?'↑':'↓'} ${pct(rate)}</span><span>over this ${h.to-h.year}-year period</span></div><details class="decision-detail"><summary>Why it changed & all five conditions</summary><p>${esc(policy.feedback)}</p><p class="small muted">Tradeoff: ${esc(policy.risk)}<br>Public-finance commitment: ${h.cost} game units. Main investment scheduled ${h.delay} years after selection.</p>${conditionResults({values:h.after.values},h)}${h.matured.length?`<p class="small muted">Investments that matured: ${h.matured.map(item=>`${item.year} — ${esc(item.title)}`).join('; ')}.</p>`:''}</details></li>`;
 }).join('')}</ol><p class="small muted">GDP per person: constant 2015 US$. Condition changes: 0–100 game units. Route labels describe your policy choices; period changes describe the model outcome, not a causal estimate for that policy alone.</p></section>`;
}

// Cultural adaptation pathways — shown at end of any run (Ghana or Korea).
// Does NOT change GDP or any numerical outcome. Uses recorded choice history only for pathway matching.
function whatCouldGhanaAdapt(){
 const tags=state.history.map(h=>h.tag);
 const count=list=>list.filter(t=>tags.includes(t)).length;
 const authorityScore=count(['voice','audit','central']);
 const networksScore=count(['networks','cooperate','access']);
 const horizonScore=count(['patient','technical','voice']);
 // Determine which pathway most closely matches the player's recorded choices.
 const scores=[{key:'authority',score:authorityScore},{key:'networks',score:networksScore},{key:'horizon',score:horizonScore}];
 scores.sort((a,b)=>b.score-a.score);
 const featured=scores[0].key;
 const ghana=state.country==='gha';
 const countryNote=ghana?'':'You played as South Korea. The proposals below describe adaptations for Ghana; your Korean run illustrates some of the documented lessons they draw on. The Korean experience is a real reference point — your simulated Korean outcomes are not.';
 const pathways=[
  {key:'authority',lens:'Authority & voice',title:'Building feedback into delivery',
   short:`Korea's industrial programmes tied continued government support to performance evidence — firms that did not meet export targets faced review. This was an institutional arrangement, not a cultural habit. Ghana has district governance structures and community accountability traditions. A proposal worth exploring: attach multi-year skills and enterprise programmes to regular independent reviews — a built-in route for the programme to learn what is working and change what is not, before resources are spent on a failing direction.`,
   brief:`<strong>Ghanaian setting:</strong> District-level vocational and apprenticeship programmes under the National Apprenticeship Programme framework face documented feedback constraints (World Bank Ghana diagnostic, SRC-WB-GHA20-001).<br><br><strong>Cultural mechanism:</strong> Patron-client dynamics in Ghanaian organisations (documented as a pattern in political economy literature — a hypothesis, not a proven causal claim) may slow upward challenge. Ghana also has community accountability traditions that can be worked with.<br><br><strong>Documented Korean lesson:</strong> Korea's export-performance discipline (1960s–70s) made continued government credit conditional on meeting export targets. The World Bank East Asian Miracle volume (SRC-WB-EAM93-001) documents this as a correction mechanism. Limits: export targets are measurable; skills outcomes are harder to quantify.<br><br><strong>Local adaptation:</strong> Attach explicit, independently reviewed checkpoints to multi-year skills programmes. Develop review criteria with participants, not just administrators. Share results publicly.<br><br><strong>Implementation:</strong> Ministry of Employment + district assemblies + civil-society partners. Year 1: diagnostic. Years 2–3: pilot with annual independent review. Year 4: evaluate expansion. Resource categories: technical assistance, community facilitator training, independent evaluation.<br><br><strong>Tradeoffs:</strong> Review criteria set without beneficiary input may reflect designer priorities; poorly designed review creates administrative burden; if review boards are dominated by programme managers, independence is lost.<br><br><strong>Evaluation:</strong> Outcomes: proportion of adjustments made in response to review findings; employment rates for completers. Review point: after year 3. Expand if at least one substantial adjustment was driven by review findings. Stop if review findings are routinely ignored.`,
   boundary:'Documented: Korea export discipline (SRC-KIM1971-001, SRC-WB-EAM93-001); Ghana skills constraints (SRC-WB-GHA20-001). Patron-client network hypothesis: documented political economy pattern, not in approved game registry. Proposal design is original.'},
  {key:'networks',lens:'Networks & cooperation',title:'Opening networks to new entrants',
   short:`In Ghana, trader associations and informal savings circles (susu) help members access credit and market information — but newcomers without the right ties may find no entry route. Korea's chaebol system coordinated investment through connected business groups, but also created supplier networks where access followed relationships. Both cases show the question is not whether networks are useful — they clearly are — but what route exists for someone outside them. A practical direction: build open-application business-association registers with published membership criteria and transparent service access.`,
   brief:`<strong>Ghanaian setting:</strong> Trader associations and SUSU savings circles supply coordination resources to members. The World Bank Ghana diagnostic (SRC-WB-GHA20-001) documents enterprise-access constraints — credit, shared equipment, market information — as partly dependent on established ties.<br><br><strong>Cultural mechanism:</strong> Group-obligation norms (documented through in-group/out-group lens) provide real coordination resources inside associations while creating an access question for non-members. The strength is that cooperation already exists. The proposal works with it.<br><br><strong>Documented Korean lesson:</strong> Chaebol networks coordinated investment and technical knowledge (SRC-KIM1971-001, SRC-WB-EAM93-001). Korea also developed shared industrial parks and training programmes accessible beyond network membership. Limits: Korea's industrial policy had significant state financial capacity and concentrated governance; Ghana's more pluralistic environment requires different coalition-building.<br><br><strong>Local adaptation:</strong> Simple registration system for trade associations with published membership criteria; associations receiving public support open 20–30% of service slots to non-members through open-application process. Retain existing associations' internal governance.<br><br><strong>Implementation:</strong> Ministry of Trade + Ghana Trade Association + district enterprise offices. Year 1: diagnostic + criteria design. Year 2: pilot. Year 3: evaluate. Resource categories: programme officer, governance training, independent monitoring.<br><br><strong>Tradeoffs:</strong> Members may reduce cooperation if non-members benefit without reciprocal commitment; open criteria can be manipulated if not independently reviewed; elite capture through association leadership.<br><br><strong>Evaluation:</strong> Outcomes: proportion of open-access slots filled by non-members; business performance at 12 and 24 months. Stop if no measurable benefit to open-access participants.`,
   boundary:'Documented: Ghana enterprise constraints (SRC-WB-GHA20-001); chaebol structure (SRC-KIM1971-001, SRC-WB-EAM93-001). SUSU and trader associations: documented in microfinance literature — not in approved game registry. Open-access mechanism is original proposal.'},
  {key:'horizon',lens:'Long-horizon learning',title:'Patient investment with a correction mechanism',
   short:`Korea sustained multi-year investment in firm learning and skills well past each budget cycle — and tied that investment to performance evidence so that continued support was conditional, not automatic. This combination — patient enough to let learning accumulate, responsive enough to stop what was not working — is what the Continuity + Adaptation theory describes. Ghana has documented apprenticeship traditions and sector-specific skills programmes. A practical direction: design skills programmes with a built-in multi-year commitment (four to six years minimum) and an explicit mid-point review with published results and a real decision point about whether to continue, change, or stop.`,
   brief:`<strong>Ghanaian setting:</strong> Ghana's National Apprenticeship Programme (NAP) and post-independence education investment represent documented attempts at sustained skills commitment. The World Bank Ghana diagnostic (SRC-WB-GHA20-001) identifies the skills-productivity gap as a constraint on productive transformation.<br><br><strong>Cultural mechanism:</strong> Ghana's informal apprenticeship system is a documented form of patient, relationship-based investment: masters invest over 2–5 years. The adaptation asks whether this patient structure can be supported without destroying its flexibility, while adding a correction mechanism it currently lacks.<br><br><strong>Documented Korean lesson:</strong> Korea's vocational training combined government co-funding with in-company training requirements; export-performance conditions made support conditional on results (SRC-WB-EAM93-001, SRC-KIM1971-001). The Confucian examination tradition — extended family investment in high-stakes test preparation — is a plausible cultural hypothesis for sustained education investment, but the institutional design did the measurable work. Limits: Korea's institutional capacity was significant; direct replication is not feasible without adapting to Ghana's context.<br><br><strong>Local adaptation:</strong> Four-to-six-year minimum funding commitment with mid-point review and published results. Apprentices receive a formal rights statement and a review route. Retain master-apprentice relationships; add accountability.<br><br><strong>Implementation:</strong> Ministry of Employment + NAP secretariat. Year 1: review existing cohorts. Years 2–4: pilot with quarterly monitoring. Year 5: evaluation. Resource categories: programme management, independent evaluation, master-trainer support.<br><br><strong>Tradeoffs:</strong> Longer commitment reduces flexibility; mid-point review may be captured by programme managers; cost-sharing may exclude very small firms.<br><br><strong>Evaluation:</strong> Outcomes: 12-month employment rate vs. standard programmes; proportion of mid-point reviews producing documented programme changes. Expand if higher completion rates and at least one meaningful adjustment. Stop if no adjustments despite review.`,
   boundary:'Documented: Ghana 1964 plan (SRC-GHA-PLAN64-001); skills constraints (SRC-WB-GHA20-001); Korea training context (SRC-WB-EAM93-001, SRC-KIM1971-001). Confucian examination hypothesis: plausible — not a proven causal mechanism. NAP contemporary practice: documented government programme, outcomes not in approved registry. Proposal design is original.'}
 ];
 const pathwayHTML=pathways.map(p=>{
  const isFeatured=p.key===featured;
  return `<div class="adapt-pathway ${isFeatured?'is-featured':''}">${isFeatured?'<span class="adapt-match-tag">Matches your choices</span>':''}<span class="pathway-lens">${esc(p.lens)}</span><h3>${esc(p.title)}</h3><p>${esc(p.short)}</p><details><summary>Deeper brief: setting, Korean lesson, adaptation, tradeoffs, evaluation</summary><p>${p.brief}</p><p class="adapt-boundary"><strong>Evidence boundary:</strong> ${esc(p.boundary)}</p></details></div>`;
 }).join('');
 const reflection=`<div class="adapt-reflection"><strong>A question to sit with</strong>Can you identify: (1) one Korean practice documented in this game that Ghana could adapt, (2) one specific change you would make for the Ghanaian context, and (3) one result that would change your mind about whether the adaptation is working? The game cannot evaluate your answer — but writing it down is the exercise. No AI scoring is applied to anything you enter here.</div>`;
 return `<section class="adapt-section" aria-labelledby="adapt-heading"><div class="eyebrow">Practical lessons · Cultural mechanisms</div><h2 id="adapt-heading">What could Ghana adapt?</h2><p>These three pathways connect documented Korean development practices to adaptable Ghanaian proposals. They correspond to the cultural mechanisms explored in the game: authority and voice, networks and cooperation, and long-horizon learning. Each pathway is evidence-backed, honestly hedged, and original — a research direction, not a policy prescription. The pathway most consistent with your choices in this run is highlighted.</p>${countryNote?`<p class="small muted">${esc(countryNote)}</p>`:''}<div class="adapt-pathways">${pathwayHTML}</div>${reflection}<p class="small muted">Korean lessons are documented independently of your simulated results. Your simulated GDP cannot establish what caused historical growth; these proposals apply to a real-world question that the game explores but cannot answer. Ghana and South Korea are two cases, not continent-wide experiments.</p></section>`;
}
function end(){const rank=ranking().findIndex(r=>r.id===saveIdentity(state))+1,c=COUNTRIES[state.country];return `<section class="end-hero"><div><div class="eyebrow">${c.marker} ${c.name} / 2026 / Journey complete</div><h1>A future shaped<br>by your choices.</h1><div class="end-score-period"><strong>2026</strong><span>Final simulated<br>GDP per person</span></div><div class="end-value" data-final-year="2026">${money(state.gdp)}</div><p class="small muted">constant 2015 US$ · ${pct(growth(state))} since 1960<br>Local overall rank ${rank||'—'} of ${board.length} · Identical completed paths count once.</p><div class="inline"><button class="primary" data-country="gha">Replay as Ghana</button><button data-country="kor">Replay as South Korea</button><button data-panel="scores">${CLASS_MODE?'Class leaderboard':'Local leaderboard'}</button></div></div><div>${scene(state,true)}</div></section>${classSubmitPanel()}${historyComparison(state,true)}${gdpChart(state)}<div class="end-analysis">${insights(state).map(i=>`<article><h3>${i.title}</h3><p>${i.text}</p></article>`).join('')}</div><p class="small">This is a model outcome, not an observed 2026 statistic, forecast or causal test. Ghana and South Korea cannot establish continent-wide conclusions. The magazine also tests Botswana, Mauritius, Malaysia and the Philippines. GDP omits distribution, health, freedoms and much else that matters.</p>${culturalProfile()}${whatCouldGhanaAdapt()}${decisionHistory(state)}`;}
function panelTop(title,kicker='Field notes'){return `<div class="panel-top"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1></div><button data-action="back">← Back</button></div>`;}
function rules(){return `<section class="screen-panel">${panelTop('How to play')}<p>Choose Ghana or South Korea. Your goal is the highest <strong>simulated GDP per person in 2026</strong>. There are 15 policy decisions, covering 66 years. Allow about 10–15 minutes to read and reflect; there is no timer.</p><ol><li>Read the situation, benefits and risks. Hover or keyboard-focus a policy to preview its landscape. Clicking or tapping selects it and keeps the preview visible; the dashboard changes only after confirmation.</li><li>Select one policy and review it. Press Confirm to make it final. No undo is available.</li><li>Inspect the consequences, delayed investments and any dated external event. Press Continue when ready.</li><li>Reach 2026, examine your path and compare completed runs on this browser's leaderboard.</li></ol><h2>Five conditions, one connected model</h2><p>Education and skills, infrastructure, productive capacity, institutional effectiveness and public finances are <strong>0–100 game constructs</strong>. Public finances are a resource buffer, not a debt-to-GDP measure. Their numbers are invented design assumptions, not observed historical indices.</p><p>Investments cost resources now and mature later. Institutions and finances affect execution. Some routes also depend on existing skills, infrastructure or capacity; all three remain selectable. Low finances can slow or reverse income growth. Everyone reaches 2026.</p><h2>Culture as a question</h2><p>Network access asks who can cooperate with whom. Authority and feedback asks who can challenge a weak project. Long-term investment asks how patient learning can coexist with correction. These relate to individualism/collectivism, power distance and long-term orientation without turning them into national personality scores. Country-level indices cannot describe individual people (Hofstede, 2011; approved claims RES002-A01, A03).</p><h2>Save and resume</h2><p>The game saves after confirmed policies and screen transitions. Use Resume to return to the same phase. Closing a feedback screen does not apply its effects again. New game and restart ask before replacing unfinished progress.</p><p>Local-file storage varies by browser and file path. The leaderboard belongs to this browser and laptop. Save / import provides a readable JSON backup of progress and completed runs. Imported scores are rebuilt from their choice sequences; identical paths count once.</p><h2>Keyboard and motion</h2><p>Use Tab to move between controls, Enter or Space to activate them. The map and country list select the same countries. Your system's reduced-motion setting disables animated zoom and buildings. There are no timed inputs.</p><p class="small muted">Historical context uses sources. Policy dilemmas are counterfactual game designs. Numerical effects are not researched causal estimates. Sources & model contains the full methodology and offline reference text.</p></section>`;}
function methodology(){return `<h2>What the model assumes</h2><p>Model version ${MODEL}. Both countries use the same equations, policy-delivery rules, upkeep and safeguards. No national growth bonus exists. Starting condition vectors are illustrative design assumptions: Ghana [22, 24, 25, 30, 56], South Korea [32, 19, 22, 30, 50], ordered as skills, infrastructure, capacity, institutions, finances. They are not measured indices or inferred national cultural advantages. Only starting income is an observed numeric calibration.</p><p>Each year earns growth from the conditions in place at its start. Policies spend finances immediately and schedule a delayed vector. Institutional effectiveness and pre-policy finances scale delivery. An explicitly tagged preparation threshold increases or reduces that policy's effectiveness; it never removes an option.</p><pre>Execution factor = (0.65 + 0.50 × institutions/100)
                 × (0.55 + 0.45 × finances/100)
                 × preparation (1.25 if ready, 0.70 if below threshold;
                                1.00 when no threshold applies)
All now and later policy vectors use this factor; costs do not.

Annual growth rate = 0.002 + 0.00030 × skills
  + 0.00028 × infrastructure + 0.00045 × capacity
  + 0.00030 × institutions
  − 0.00100 × max(0, 35 − finances)
  − 0.00012 × max(0, capacity − min(skills, infrastructure) − 15)
  + dated shock adjustment

GDP(next year) = GDP(this year) × (1 + annual growth rate)
Growth since 1960 = (current GDP / observed starting GDP − 1) × 100

Annual upkeep: skills −0.20; infrastructure −0.30;
capacity −0.25 + 0.001 × min(skills, infrastructure);
institutions −0.08;
finances +3.1 + 0.020 × institutions − 0.010 × capacity.

Shock adjustments, in their named year only:
1973 oil: −0.075 × (1 − 0.50×infrastructure/100 − 0.25×finances/100)
1983 Ghana drought: −0.12 × (1 − 0.45×infrastructure/100 − 0.30×finances/100)
1997 Korea finance: −0.13 × (1 − 0.45×institutions/100 − 0.30×finances/100)
2020 pandemic: −0.09 × (1 − 0.35×skills/100 − 0.35×institutions/100)
Shocks also change finance by adjustment×70 and capacity by adjustment×20.
Growth uses pre-shock conditions, plus the adjustment; reduced conditions
carry forward into later years. These numerical magnitudes are invented.

Safeguards: conditions bounded to 0–100; annual rates −10% to +9%;
GDP bounded to US$1–US$1 billion per person. These are game rules,
not economic laws. No random rolls. No early game-over.</pre><p>Annual simulation covers [1960, 1964), then each decision interval, through [2020, 2026): exactly 66 updates. Delayed effects apply once in their due year; effects due at the next decision boundary apply before that decision. A 2020 choice is available before the model applies that year's disruption; this is a pacing convention, not a claim about when a historical government acted.</p><h2>What it can and cannot teach</h2><p>The model illustrates complementarities, timing, financial constraints and conditional cultural mechanisms. It does not estimate policy effects, reproduce historical GDP, model political freedoms, health, inequality, mortality, private debt or trade flows. Its equal equations cannot establish equal real-world opportunities. Fixed external events still occur in counterfactual runs, which is a simplification. Its single-year shocks simplify multi-year crises.</p><p>Ten shared learning themes and five country-specific dilemmas are encoded per country. Historical context grounds their questions; the three alternatives are invented. There is no claim that a government considered these exact options. The explicit 1960–2026 game schedule is the authorised exception to the magazine's 1960/1990/2020 comparison anchors.</p><h2>Historical GDP comparison</h2><p>The benchmark updates at every decision year using verified World Bank values in constant 2015 US dollars (NY.GDP.PCAP.KD), plus 1990 retained for the original anchor summary. The saved API snapshot was last updated 8 October 2026 and retrieved 15 October 2026; all six earlier project anchor values match it exactly. The two starting incomes stay unchanged. Each comparison reads your simulated annual state and the actual GDP observation for the same year, with no interpolation. The final comparison is 2020 versus 2020; the 2026 outcome remains separately labelled simulated. Model states follow the documented year-boundary convention, while observed GDP is an annual national-accounts measure; this is an educational benchmark rather than a fitted counterfactual or causal estimate.</p><h2>Country illustration references</h2><p>Ghana’s original artwork draws selected courtyard and corrugated-roof motifs from Asante architectural heritage near Kumasi (UNESCO World Heritage Centre, n.d.; ART-GHA-001), combined with schematic market and coastal-trade imagery. It does not reproduce shrines or sacred motifs. Korea’s artwork uses hanok roof and timber-frame forms (Seoul Metropolitan Government, n.d.; ART-KOR-001), neighbourhood shop signs, and later apartment blocks informed by Seoul’s urban housing context (Seoul Museum of History, 2014; ART-KOR-002). These are composite country scenes, not a specific town, all housing in either country, or an Africa/Asia template. Both countries retain homes, markets, schools, industry and modern buildings; both use identical model thresholds for visual expansion. Modern forms appear from 1980 when infrastructure and productive capacity reach 45 game units; this is a drawing rule, not a historical development claim. Hangul labels use a local Korean-capable font fallback; there is no external font request.</p><h2>Geography and illustration</h2><p>Modern 1:110m Natural Earth outlines locate the two countries; they are not a political history map. Public-domain coordinates were converted to an equirectangular SVG. Terrain, paths, trees, homes, boats, farms and buildings are original symbolic drawings. They are not photographic evidence or reconstructions of a real city. The scene begins with homes, farms and working businesses in both countries. School and business symbol counts follow model conditions; low finances dim some production buildings.</p><h2>Visual direction and previews</h2><p>The user selected <strong>B · Cartographic desk</strong> on 15 October 2026: a larger cool atlas and blue dashboard. The original A/B/C comparison drafts remain preserved. Country colours and markers stay fixed.</p><p>Hovering or keyboard-focusing a policy renders a temporary copy of the model through the next decision year. Highlighted buildings and connections sketch that policy’s focus, including improvements smaller than a whole scene symbol. These sketches illustrate intent; they are not additional model assets or measured counts. No GDP result is disclosed before confirmation. Previewing does not change the live economy, history, saves or leaderboard. Selecting retains a preview; confirmation alone applies consequences.</p><h2>Font and licence</h2><p>Montserrat WOFF2 fonts are embedded from the magazine's existing chart assets. Local Avenir Next / sans-serif is a fallback if a browser cannot decode them. The embedded font is distributed under SIL Open Font License 1.1. Game artwork is original; Natural Earth is public domain.</p><details><summary>Read the complete Montserrat licence</summary><pre>${esc(DATA.fontLicense)}</pre></details><details><summary>Inspect all scenarios and numerical effects</summary><pre>${esc(JSON.stringify(DATA.scenarios,null,2))}</pre></details>`;}
function sources(target){return `<section class="screen-panel">${panelTop('Sources & model','Evidence / interpretation / design')}<p>Offline reference text and locators are embedded below. Links open original sources when internet access is available; gameplay makes no network requests. Approved magazine records keep their original verification dates. Newly checked game references are dated 15 October 2026.</p><p>Starting GDP uses the supplied frozen WDI series rather than a live revision. Country-level cultural definitions inform questions, not scores. Source-access limitations are visible in their records.</p>${methodology()}<h2>References and approved claim locators</h2>${Object.entries(DATA.sources).map(([key,r])=>`<article class="source" id="ref-${esc(key)}"><strong>${esc(key)} · ${esc(r.label)}</strong><p>${esc(r.text)}</p><p class="locator">Locator / limit: ${esc(r.locator)}</p><p class="locator">${r.status?`Registry status: ${esc(r.status)}. ${esc(r.limitations)}`:''}</p><p class="small">Verified / reviewed ${esc(r.date)}${r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Original source ↗</a>`:''}${r.links?` · Source IDs: ${r.links.map(esc).join(', ')}`:''}</p></article>`).join('')}</section>`;}
function scores(){const rows=ranking(boardFilter,CLASS_MODE?classBoard||[]:board);return `<section class="screen-panel">${CLASS_MODE?panelTop('The class leaderboard','Everyone playing this game online'):panelTop('The local leaderboard','Completed model journeys')}<p>Ranked by final simulated GDP per person, constant 2015 US$. ${CLASS_MODE?'Shared by everyone playing from this web address. Each score is recalculated from the player’s 15 choices. Updates every few seconds.':'This browser and laptop only.'} Identical country-and-policy paths count once. Deterministic model 1.0; no historical ranking.</p>${CLASS_MODE&&classStatus?`<p role="status" class="small"><strong>${classStatus}</strong></p>`:''}${CLASS_MODE&&!classBoard&&!classStatus?'<p class="small muted">Loading the class leaderboard…</p>':''}<div class="inline" role="group" aria-label="Leaderboard filter">${[['all','Overall'],['gha','● Ghana'],['kor','◆ South Korea']].map(([v,label])=>`<button data-filter="${v}" aria-pressed="${boardFilter===v}">${label}</button>`).join('')}</div>${rows.length?`<ol class="score-list">${rows.map((r,i)=>`<li><span>${i+1}. ${r.name?`<strong>${esc(r.name)}</strong> · `:''}${COUNTRIES[r.country].marker} ${COUNTRIES[r.country].name}<br><span class="small muted">${pct(r.growth)} since 1960 · 15 decisions</span></span><strong>${money(r.gdp)}</strong></li>`).join('')}</ol>`:'<p style="margin-top:24px">No completed journeys here yet. Finish all 15 decisions to put a path on the board.</p>'}<p class="small muted">Scores and progress can be exported together in Save / import. Moving or renaming the HTML may change its browser storage area.</p></section>`;}
function savePanel(){return `<section class="screen-panel">${panelTop('Keep your journey','Readable JSON backup')}<p>Export progress and the local leaderboard before closing the file if browser storage is unavailable. Import a backup from this game version to resume on another laptop. Importing replaces current progress and merges completed paths after validation.</p><div class="inline"><button class="primary" data-action="export">Download JSON backup</button><button data-action="show-json">Show backup text</button></div><p class="small muted" style="margin-top:16px">If downloads are blocked, copy the displayed text into a plain .json file.</p><label for="save-json">Backup JSON</label><textarea class="save-text" id="save-json" spellcheck="false" placeholder="Paste an Atlas 1.0 backup here, or show your current backup text."></textarea><div class="inline" style="margin-top:16px"><button data-action="import-text">Import this text</button><label>Or select a JSON backup <input type="file" id="import-file" accept=".json,application/json"></label></div><p id="save-result" role="status" class="small" style="margin-top:16px"></p></section>`;}
function render(focus=true){hoveredChoice=null;focusedChoice=null;displayedSceneKey=null;if(state)updateCultureScores();document.documentElement.style.setProperty('--accent',state?COUNTRIES[state.country].color:'#B95332');document.getElementById('resume-nav').disabled=!memorySave;document.getElementById('restart-nav').disabled=!state;const views={home,intro,decision,feedback,end,rules,sources,scores,save:savePanel};main.innerHTML=(views[screen]||home)();if(screen==='intro')requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('map-world')?.classList.add('zoom-'+state.country)));if(focus)focusMain();}
function openPanel(name,target){if(!['rules','sources','scores','save'].includes(screen))returnScreen=screen;screen=name;render();if(target){const el=document.getElementById('ref-'+target);el?.scrollIntoView();if(el){el.tabIndex=-1;el.focus({preventScroll:true});}}}
function unfinished(){return (state||memorySave)?.phase!=='end'&&!!(state||memorySave);}
function chooseCountry(country){if(previewMode)return;if(CLASS_MODE){if(!playerName){openNameDialog(country);return;}classMsg='';}if(unfinished()&&!window.confirm('Replace your unfinished journey? Confirmed decisions in the current save will be replaced. Export it first if you want to keep it.'))return;state=fresh(country);screen='intro';selected=null;persist();render();announce(COUNTRIES[country].name+' selected. Historical introduction, 1960.');}
function backup(){return {version:VERSION,model:MODEL,save:state||memorySave,leaderboard:board};}
function importBackup(text){if(text.length>2e6)throw Error('Backup is too large. Use an unedited game export.');const raw=JSON.parse(text);if(raw.version!==VERSION||raw.model!==MODEL||!Array.isArray(raw.leaderboard))throw Error('This is not an Atlas 1.0 backup.');const s=raw.save===null?null:validateSave(raw.save);if(raw.leaderboard.length>500)throw Error('Backup contains too many scores.');const imported=validBoard(raw.leaderboard);if(imported.length!==raw.leaderboard.length)throw Error('Backup contains invalid or duplicate completed paths.');if(unfinished()&&!window.confirm('Import this backup and replace the unfinished journey?'))return false;board=validBoard([...board,...imported]);state=s;memorySave=s?clone(s):null;selected=null;storeWrite(SAVE_KEY,s?JSON.stringify(s):'');storeWrite(SCORES_KEY,JSON.stringify(board));storageStatus();return true;}
// Hover and keyboard focus affect only the scene. Selection is still a separate click.
document.addEventListener('pointerover',event=>{
 if(event.pointerType==='touch')return;
 const option=previewOption(event.target);
 if(option){hoveredChoice=Number(option.dataset.choice);updateDecisionPreview();}
});
document.addEventListener('pointerout',event=>{
 if(event.pointerType==='touch')return;
 const option=previewOption(event.target),next=previewOption(event.relatedTarget);
 if(!option||option===next)return;
 hoveredChoice=next?Number(next.dataset.choice):null;updateDecisionPreview();
});
document.addEventListener('focusin',event=>{
 const option=previewOption(event.target);
 if(option){hoveredChoice=null;focusedChoice=Number(option.dataset.choice);updateDecisionPreview();if(screen==='decision')announce('Landscape preview: '+DATA.scenarios[state.country][state.index].options[focusedChoice].title+'. Unconfirmed. Press Enter or Space to select.');}
});
document.addEventListener('focusout',event=>{
 if(!previewOption(event.target))return;
 const next=previewOption(event.relatedTarget);focusedChoice=next?Number(next.dataset.choice):null;updateDecisionPreview();
});
// 6. Event handlers and phase guards. Confirmation and Continue each act only once.
document.addEventListener('click',event=>{
 const b=event.target.closest('button,[data-country]');if(!b||b.disabled)return;
 if(b.dataset.country){chooseCountry(b.dataset.country);return;}
 if(b.dataset.panel){openPanel(b.dataset.panel);return;}
 if(b.dataset.source){openPanel('sources',b.dataset.source);return;}
 if(b.dataset.filter){boardFilter=b.dataset.filter;render(false);return;}
 if(b.dataset.choice!==undefined){if(screen!=='decision'||state?.phase!=='decision'||previewMode)return;selected=Number(b.dataset.choice);render(false);document.querySelector(`[data-choice="${selected}"]`)?.focus({preventScroll:true});announce('Selected '+DATA.scenarios[state.country][state.index].options[selected].title+'. Review and confirm when ready.');return;}
 switch(b.dataset.action){
  case 'culture-toggle':culturePanelCollapsed=!culturePanelCollapsed;renderCulturePanel();{const btn=main.querySelector('.culture-toggle');if(btn){btn.textContent=culturePanelCollapsed?'Show':'Hide';btn.setAttribute('aria-expanded',culturePanelCollapsed?'false':'true');}}break;
  case 'home':screen='home';render();break;
  case 'new':if(unfinished()&&!window.confirm('Replace your unfinished journey with a new game? Export it first to keep it.'))break;state=null;memorySave=null;selected=null;storeWrite(SAVE_KEY,'');screen='home';render();break;
  case 'restart':if(!state||previewMode)break;chooseCountry(state.country);break;
  case 'resume':if(!memorySave)break;state=clone(memorySave);screen=state.phase;selected=null;if(screen==='end')recordEnd();render();announce('Resumed '+COUNTRIES[state.country].name+', '+state.year+', '+state.phase+'.');break;
  case 'start':if(screen!=='intro'||state?.phase!=='intro')break;state.phase='decision';screen='decision';persist();render();announce('Decision 1 of 15, 1960.');break;
  case 'confirm':if(screen!=='decision'||state?.phase!=='decision'||selected===null||previewMode)break;state=simulateChoice(state,selected);selected=null;screen='feedback';persist();render();announce('Policy confirmed. Now '+state.year+'. Simulated GDP per person '+money(state.gdp)+'. Read consequences, then Continue.');break;
  case 'continue':if(screen!=='feedback'||state?.phase!=='feedback')break;state=advance(state);screen=state.phase;selected=null;persist();if(screen==='end')recordEnd();render();announce(screen==='end'?'Your 2026 outcome is ready.':'Decision '+(state.index+1)+' of 15, '+state.year+'.');break;
  case 'back':screen=returnScreen;render();break;
  case 'show-json':document.getElementById('save-json').value=JSON.stringify(backup(),null,2);announce('Backup text is ready to copy.');break;
  case 'class-submit':submitClass();break;
  case 'name-save':saveName();break;
  case 'name-cancel':if(playerName){pendingCountry=null;document.getElementById('name-dialog').close();}break;
  case 'change-name':openNameDialog();break;
  case 'export':{const data=JSON.stringify(backup(),null,2);document.getElementById('save-json').value=data;const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='development-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('save-result').textContent='Backup prepared. If no download appeared, copy the text above.';break;}
  case 'import-text':try{if(importBackup(document.getElementById('save-json').value)){document.getElementById('save-result').textContent='Backup imported. Press Resume to continue the restored journey.';document.getElementById('resume-nav').disabled=!memorySave;}}catch(e){document.getElementById('save-result').textContent='Could not import: '+e.message;}break;
 }
});
document.addEventListener('keydown',event=>{if(event.target.id==='class-name'&&event.key==='Enter'){event.preventDefault();submitClass();return;}if(event.target.id==='player-name'&&event.key==='Enter'){event.preventDefault();saveName();return;}const target=event.target.closest('[data-country][role="button"]');if(target&&(event.key==='Enter'||event.key===' ')){event.preventDefault();chooseCountry(target.dataset.country);}});
document.addEventListener('change',async event=>{if(event.target.id!=='import-file')return;const f=event.target.files[0];if(!f)return;const result=document.getElementById('save-result');try{if(f.size>2e6)throw Error('Backup exceeds 2 MB.');const text=await f.text();document.getElementById('save-json').value=text;if(importBackup(text)){result.textContent='Backup imported. Press Resume to continue.';document.getElementById('resume-nav').disabled=!memorySave;}}catch(e){result.textContent='Could not import: '+e.message;}});
if(previewMode){document.body.classList.add('preview-'+previewMode);const labels={a:['A · Field atlas','Balanced landscape and policy panel. Cream paper; country colours mark identity.'],b:['B · Cartographic desk','Larger cool landscape, ink-blue dashboard. Tests screen hierarchy and atlas emphasis.'],c:['C · Editorial expedition','Warm terrain, compact policy list, larger headline. Tests print rhythm and editorial density.']};const [title,desc]=labels[previewMode];document.getElementById('preview').innerHTML=`<div class="preview-banner"><strong>${title}</strong><span>${desc} Same content: Ghana · 1968. Visual study, awaiting selection.</span></div>`;state=replay('gha',[0,0],'decision');screen='decision';}else restoreInitial();
render(false);
document.getElementById('name-dialog').addEventListener('cancel',e=>{if(!playerName)e.preventDefault();});
if(CLASS_MODE){if(!playerName&&screen==='home')openNameDialog();fetchClass();setInterval(()=>{if(document.visibilityState==='visible'&&(screen==='scores'||screen==='end'))fetchClass();},6000);}
// Inspectable test interface; no test code or dependencies are needed for play.
window.Atlas={fresh,simulateChoice,advance,replay,validateSave,validBoard,ranking,DATA,COUNTRIES,SHOCKS,VERSION,MODEL,getState:()=>clone(state),getBoard:()=>clone(board),growth,insights,matchedGDP,historyComparison,decisionDirection};
</script>
